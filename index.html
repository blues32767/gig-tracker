<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聽團網 — 下一場，在現場見。</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f5f5f3;
            --bg-card: #ffffff;
            --bg-subtle: #eeeee9;
            --text-main: #111111;
            --text-secondary: #666666;
            --accent: #d4f55a;
            --border: #111111;
        }
        html.dark {
            --bg-main: #0c0c0e;
            --bg-card: #141417;
            --bg-subtle: #1c1c21;
            --text-main: #f4f4f5;
            --text-secondary: #9898a0;
            --border: #f4f4f5;
            --accent: #d4f55a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; letter-spacing: -0.01em; }
        body { background: var(--bg-main); color: var(--text-main); padding-top: 140px; transition: background-color 0.3s, color 0.3s; overflow-x: hidden; }
        
        .hero-grid { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(to right, var(--text-main) 1px, transparent 1px), linear-gradient(to bottom, var(--text-main) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.05; pointer-events: none; z-index: -1; }
        html.dark .hero-grid { opacity: 0.1; }

        nav { position: fixed; top: 12px; left: 1rem; right: 1rem; max-width: 1200px; margin: 0 auto; background: var(--bg-card); border: 2px solid var(--text-main); z-index: 1000; box-shadow: 4px 4px 0px var(--text-main); display: flex; flex-direction: column; padding: 0.5rem; gap: 8px; transition: transform 0.3s ease, background-color 0.3s, border-color 0.3s, box-shadow 0.3s; }
        nav.nav-hidden { transform: translateY(-150%); box-shadow: none; }
        
        .nav-top { display: flex; justify-content: space-between; align-items: center; }
        .nav-brand { font-size: 1.1rem; font-weight: 900; color: var(--text-main); text-transform: uppercase; }
        .nav-links { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; border-top: 1.5px dashed var(--text-main); padding-top: 8px; }
        .nav-item { font-size: 0.75rem; font-weight: 800; text-align: center; padding: 6px 0; border: 1.5px solid var(--border); background: var(--bg-subtle); color: var(--text-secondary); cursor: pointer; white-space: nowrap; }
        .nav-item.active { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); }
        .theme-btn { font-size: 0.8rem; font-weight: 800; background: var(--bg-subtle); border: 1.5px solid var(--text-main); padding: 4px 10px; cursor: pointer; box-shadow: 2px 2px 0px var(--text-main); }
        
        @media (min-width: 768px) {
            nav { flex-direction: row; align-items: center; justify-content: space-between; padding: 0 1.5rem; height: 64px; }
            .nav-links { display: flex; border-top: none; padding-top: 0; gap: 8px; }
            .nav-item { padding: 6px 12px; font-size: 0.85rem; }
        }

        .container { max-width: 1200px; margin: 0 auto 2rem auto; padding: 0 1rem; width: 100%; overflow-x: hidden; }
        
        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .filter-btn { font-size: 0.8rem; font-weight: 800; padding: 6px 14px; border: 2px solid var(--text-main); background: var(--bg-card); color: var(--text-main); cursor: pointer; border-radius: 20px; box-shadow: 2px 2px 0px var(--text-main); transition: all 0.2s; white-space: nowrap; }
        .filter-btn:active { transform: translate(2px, 2px); box-shadow: none; }
        
        /* 樂團代表色 */
        .filter-btn.active.fb-all { background: var(--text-main); color: var(--bg-main); box-shadow: none; transform: translate(2px, 2px); }
        .filter-btn.active.fb-mango { background: #ff6600; border-color: #ff6600; color: #fff; box-shadow: none; transform: translate(2px, 2px); }
        .filter-btn.active.fb-bisiugroup { background: #e63946; border-color: #e63946; color: #fff; box-shadow: none; transform: translate(2px, 2px); }
        .filter-btn.active.fb-papunband { background: #1d3557; border-color: #1d3557; color: #fff; box-shadow: none; transform: translate(2px, 2px); }
        .filter-btn.active.fb-icyball { background: #00b4d8; border-color: #00b4d8; color: #111; box-shadow: none; transform: translate(2px, 2px); }
        .filter-btn.active.fb-gongguan { background: #2a9d8f; border-color: #2a9d8f; color: #fff; box-shadow: none; transform: translate(2px, 2px); }
        
        .b-mango { background: #ff6600; border-color: #cc5200; color: #fff;}
        .b-bisiugroup { background: #e63946; border-color: #b52935; color: #fff;}
        .b-papunband { background: #1d3557; border-color: #112138; color: #fff;}
        .b-icyball { background: #00b4d8; border-color: #0087a1; color: #111; }
        .b-gongguan { background: #2a9d8f; border-color: #1f756b; color: #fff;}
        .b-default { background: var(--text-secondary); border-color: var(--text-main); color: var(--bg-main); }

        .search-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; width: 100%; max-width: 100%; }
        @media (min-width: 768px) {
            .search-container { flex-direction: row; justify-content: space-between; align-items: center; }
        }
        
        .search-input { width: 100%; max-width: 100%; padding: 8px 12px; border: 2px solid var(--text-main); background: var(--bg-card); color: var(--text-main); font-size: 0.85rem; font-weight: 700; box-shadow: 2px 2px 0px var(--text-main); }
        @media (min-width: 768px) { .search-input { max-width: 300px; } }

        .events-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; width: 100%; }
        @media (min-width: 768px) { .events-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (min-width: 1024px) { .events-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

        .compact-card { display: flex; padding: 10px; gap: 12px; background: var(--bg-card); border: 2px solid var(--text-main); box-shadow: 3px 3px 0px var(--text-main); border-radius: 6px; align-items: flex-start; transition: transform 0.2s, box-shadow 0.2s; width: 100%; box-sizing: border-box; overflow: hidden;}
        .compact-card:hover { transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--text-main); }
        
        .cc-date { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--text-main); color: var(--bg-main); min-width: 52px; padding: 6px 4px; border-radius: 4px; flex-shrink: 0; }
        .cc-date .m { font-size: 11px; font-weight: 800; margin-bottom: 2px; }
        .cc-date .d { font-size: 20px; font-weight: 900; line-height: 1; }
        .cc-date .day { font-size: 10px; font-weight: 800; margin-top: 2px; }
        
        .cc-info { flex: 1; min-width: 0; display: flex; flex-direction: column;}
        .cc-title { font-size: 15px; font-weight: 900; color: var(--text-main); line-height: 1.3; margin-bottom: 6px; word-wrap: break-word; overflow-wrap: break-word; hyphens: auto; }
        .cc-meta { font-size: 12px; color: var(--text-secondary); font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .cc-bands { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
        
        .band-tag { font-size: 10px; font-weight: 800; padding: 2px 6px; border: 1.5px solid var(--text-main); border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
        .band-time { font-weight: 700; font-size: 9px; padding-left: 4px; opacity: 0.9; border-left: 1px solid currentColor; }
        
        .cc-actions { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }
        .cc-btn { font-size: 11px; font-weight: 800; padding: 4px 10px; border: 1.5px solid var(--text-main); background: var(--bg-card); color: var(--text-main); text-decoration: none; border-radius: 4px; cursor: pointer; box-shadow: 1.5px 1.5px 0px var(--text-main); transition: background 0.1s; white-space: nowrap; }
        .cc-btn:hover { background: var(--text-main); color: var(--bg-main); }
        .cc-btn.active { background: var(--text-main); color: var(--bg-main); box-shadow: none; transform: translate(1.5px, 1.5px); }

        .cc-note-wrap { width: 100%; margin-top: 8px; }
        .cc-note-toggle { font-size: 11px; font-weight: 800; cursor: pointer; color: var(--text-main); padding: 4px 0; display: inline-block; text-decoration: underline; text-decoration-style: dashed;}
        .cc-note-toggle:hover { color: var(--accent); }
        .cc-note-content { font-size: 11.5px; color: var(--text-secondary); background: var(--bg-subtle); padding: 6px 8px; border: 1px dashed var(--border); margin-top: 4px; line-height: 1.5; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; display: none; }
        .cc-note-content.open { display: block; }
        
        .setlists-wrap { width: 100%; margin-top: 8px; }
        .setlist-summary { font-size: 11px; font-weight: 800; cursor: pointer; color: var(--text-main); padding: 4px 0; display: inline-block; text-decoration: underline; text-decoration-style: dashed; }
        .setlist-summary:hover { color: var(--accent); }
        .setlist-content { background: var(--bg-subtle); border: 1.5px dashed var(--text-main); padding: 8px; font-size: 11.5px; font-weight: 700; border-radius: 4px; margin-top: 4px; display: none; word-wrap: break-word; overflow-wrap: break-word; }
        .setlist-content.open { display: block; }
        .sl-band-title { font-weight: 900; color: var(--text-main); margin: 6px 0 2px 0; border-bottom: 1px solid var(--border); padding-bottom: 2px;}
        .sl-song { padding: 2px 0; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        
        .section-title { font-size: 1.25rem; font-weight: 900; margin-bottom: 12px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        .empty-state { text-align: center; padding: 3rem 1rem; border: 2px dashed var(--text-main); background: var(--bg-card); border-radius: 8px; font-weight: 800; color: var(--text-secondary); grid-column: 1 / -1; width: 100%; box-sizing: border-box; }
        .btn-more { display: block; width: 100%; max-width: 200px; margin: 20px auto; text-align: center; font-size: 0.9rem; padding: 8px; font-weight: 800; background: var(--bg-card); border: 2px solid var(--text-main); box-shadow: 3px 3px 0px var(--text-main); cursor: pointer; color: var(--text-main); border-radius: 4px; }
        
        /* Stats Styles */
        .stats-list { background: var(--bg-card); padding: 20px; border: 2px solid var(--text-main); box-shadow: 4px 4px 0px var(--text-main); border-radius: 8px; width: 100%; box-sizing: border-box; overflow-x: auto;}
        .stat-row { display: grid; grid-template-columns: 120px 1fr 50px; align-items: center; gap: 12px; margin: 12px 0; font-size: 12px; font-weight: 800; min-width: 300px; }
        .stat-bar-bg { height: 8px; background: var(--bg-subtle); border-radius: 10px; overflow: hidden; border: 1px solid var(--text-main); }
        .stat-bar-fill { height: 100%; background: var(--text-main); }
        .stats-select { padding: 6px; font-size: 12px; font-weight: 700; border: 2px solid var(--text-main); background: var(--bg-card); color: var(--text-main); box-shadow: 2px 2px 0px var(--text-main); margin-bottom: 16px; max-width: 100%; }

        /* Calendar Styles (Updated for text wrapping) */
        #calendar-container { background: var(--bg-card); border: 2px solid var(--text-main); box-shadow: 4px 4px 0px var(--text-main); border-radius: 8px; padding: 10px; margin-top: 10px; width: 100%; box-sizing: border-box; overflow-x: auto; }
        .fc-theme-standard td, .fc-theme-standard th { border: 1px solid var(--border); }
        .fc-theme-standard .fc-scrollgrid { border: 2px solid var(--text-main); }
        .fc .fc-toolbar-title { font-weight: 900; color: var(--text-main); font-size: 1.2rem; }
        .fc .fc-button-primary { background-color: var(--text-main); border-color: var(--text-main); color: var(--bg-main); font-weight: 800; font-family: 'Inter', sans-serif; text-transform: uppercase; box-shadow: 2px 2px 0px var(--accent); transition: all 0.2s;}
        .fc .fc-button-primary:hover { background-color: var(--text-secondary); border-color: var(--text-secondary); box-shadow: none; transform: translate(2px, 2px);}
        .fc .fc-daygrid-day-number { color: var(--text-main); font-weight: 800; cursor: pointer; text-decoration: underline; }
        .fc .fc-col-header-cell-cushion { color: var(--text-main); font-weight: 900; padding: 8px 4px; }
        .fc-event { 
            border: 1px solid var(--text-main); border-radius: 2px; padding: 2px !important; 
            font-size: 10px; font-weight: 700; color: var(--text-main) !important; cursor: pointer; 
            box-shadow: 1px 1px 0px var(--text-main); margin-bottom: 2px;
            white-space: normal !important; overflow: visible !important; text-align: center;
        }
        .fc-event-title { white-space: pre-wrap !important; overflow: visible !important; line-height: 1.3; }
        
        html.dark .fc .fc-button-primary { color: var(--text-main); background-color: var(--bg-subtle); }
        html.dark .fc .fc-button-primary:hover { background-color: var(--text-main); color: var(--bg-main); }
        html.dark .fc-event { color: #111 !important; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: var(--bg-main); padding: 8px 16px; font-size: 12px; font-weight: 800; border-radius: 4px; z-index: 2000; box-shadow: 4px 4px 0px var(--accent); max-width: 90vw; text-align: center;}
    </style>
</head>
<body>
    <div class="hero-grid"></div>
    <nav id="navbar">
        <div class="nav-top">
            <div class="nav-brand">聽團網 TING TUAN</div>
            <button class="theme-btn" onclick="toggleTheme()">◑ 主題</button>
        </div>
        <div class="nav-links">
            <div class="nav-item active" data-tab="upcoming">預告列表</div>
            <div class="nav-item" data-tab="calendar">行事曆</div>
            <div class="nav-item" data-tab="events">歷史歌單</div>
            <div class="nav-item" data-tab="stats">歌曲統計</div>
            <div class="nav-item" data-tab="footprints">我的足跡</div>
        </div>
    </nav>

    <div class="container">
        <!-- 移除了原先行事曆隱藏篩選列的邏輯，現在全域顯示 -->
        <div class="filter-bar" id="filters"></div>
        <div class="search-container" id="search-bar-wrapper">
            <input type="text" id="search" class="search-input" placeholder="搜尋活動、地點、歌曲...">
            <div id="status" style="font-size:10px; font-weight:700; color:var(--text-secondary); text-align:right;"></div>
        </div>
        
        <div class="section-title" id="section-title-wrap">
            <span id="tab-title">預告列表</span>
            <span id="result-count" style="font-size: 0.8rem; background: var(--text-main); color: var(--bg-main); padding: 2px 8px; border-radius: 12px;">0 場</span>
        </div>

        <div id="footprints-actions" style="display:none; margin-bottom: 16px;">
            <div style="background:var(--bg-card); border:2px dashed var(--text-main); padding:16px; border-radius:8px; margin-bottom:16px;">
                <div style="font-size:13px; font-weight:900; margin-bottom:10px; color:var(--text-main);">☁ 我的足跡雲端帳號</div>
                <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                    <input type="text" id="user-id-input" placeholder="輸入自訂 ID..." style="flex:1; min-width:120px; padding:8px 12px; border:2px solid var(--text-main); border-radius:4px; font-weight:800; font-size:14px;">
                    <button class="cc-btn" id="generate-id" onclick="generateId()">隨機產生</button>
                    <button class="cc-btn active" id="cloud-sync" onclick="cloudSync()">同步到雲端</button>
                </div>
            </div>
            <div id="footprints-analysis" style="margin-bottom:20px;"></div>
            
            <button class="cc-btn" id="export">匯出足跡 (.json)</button>
            <label>
                <input type="file" id="import" accept="application/json" hidden>
                <button class="cc-btn" onclick="document.getElementById('import').click()">匯入足跡</button>
            </label>
        </div>

        <div id="content"></div>
        
        <div id="calendar-container" style="display: none;">
            <div id="calendar"></div>
            <!-- 行事曆點擊後顯示卡片的區塊 -->
            <div id="calendar-events-list"></div>
        </div>
    </div>
    
    <div id="toast" class="toast" style="display:none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/zh-tw.js"></script>

    <script>
        // ★★★ 請替換成你的 GAS Web App URL ★★★
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwR49SJXjZM55RzbhpQyDv39sVM2J91U8BSs7gKlATQihm_QC60HOHH6FQtiA4CvLJexg/exec';
        const DATA_URL = './data.json';
        
        const BANDS = {
            mango: { name: '芒果醬', short: '芒', class: 'b-mango', color: '#ff6600' },
            bisiugroup: { name: '美秀集團', short: '美秀', class: 'b-bisiugroup', color: '#e63946' },
            papunband: { name: '怕胖團', short: '怕胖', class: 'b-papunband', color: '#1d3557' },
            icyball: { name: '冰球樂團', short: '冰球', class: 'b-icyball', color: '#00b4d8' },
            gongguan: { name: '公館青少年', short: '公館', class: 'b-gongguan', color: '#2a9d8f' }
        };
        const DAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];

        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const storage = { get: (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f } catch { return f } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true } catch { return false } } };

        let data = { upcoming: [], events: [], songsMap: {} };
        let tab = 'upcoming', query = '', limit = 24, statsBand = 'all';
        let selectedBands = new Set(['all']);
        
        let footprints = new Set(storage.get('ting-footprints', []));
        let userId = storage.get('ting-user-id', '');
        let calendar;

        const taipeiParts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()).map(p => [p.type, p.value]));
        const taipeiToday = taipeiParts.year + taipeiParts.month + taipeiParts.day;

        let lastScrollY = window.scrollY;
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            if (currentScrollY > lastScrollY && currentScrollY > 100) navbar.classList.add('nav-hidden');
            else navbar.classList.remove('nav-hidden');
            lastScrollY = currentScrollY;
        }, { passive: true });

        function dateKey(s) { return String(s || '').replace(/[-/]/g, '').replace(/\.0$/, ''); }
        
        function getDayOfWeek(dateString) {
            if (!dateString || dateString.length !== 8) return '';
            const y = parseInt(dateString.substring(0, 4)), m = parseInt(dateString.substring(4, 6)) - 1, d = parseInt(dateString.substring(6, 8));
            return DAY_NAMES[new Date(y, m, d).getDay()];
        }

        function bandInfo(id) { return BANDS[id] || { name: id, short: Array.from(id || '?')[0], class: 'b-default', color: '#666' }; }
        function safeUrl(u) { try { const x = new URL(u); return x.protocol === 'https:' ? x.href : '' } catch { return '' } }

        function showToast(msg) {
            $('#toast').innerText = msg;
            $('#toast').style.display = 'block';
            setTimeout(() => $('#toast').style.display = 'none', 3000);
        }

        // --- User ID & Cloud Sync Logic ---
        if(userId) $('#user-id-input').value = userId;

        function generateId() {
            const newId = 'USER_' + Math.random().toString(36).substring(2, 10).toUpperCase();
            $('#user-id-input').value = newId;
            storage.set('ting-user-id', newId);
        }

        $('#user-id-input').addEventListener('change', e => {
            storage.set('ting-user-id', e.target.value.trim());
        });

        async function cloudSync() {
            const uid = $('#user-id-input').value.trim();
            if(!uid) { showToast('請輸入或產生 ID'); return; }
            $('#cloud-sync').innerText = '同步中...';
            
            try {
                // 1. Fetch cloud data to merge
                const getRes = await fetch(`${GAS_URL}?action=getUser&userId=${encodeURIComponent(uid)}`);
                const getJson = await getRes.json();
                if(getJson.success && getJson.data) {
                    const cloudIds = JSON.parse(getJson.data);
                    cloudIds.forEach(id => footprints.add(id)); // Merge
                }
                
                // 2. Post merged data back to cloud
                const body = new URLSearchParams({
                    action: 'syncUser',
                    userId: uid,
                    data: JSON.stringify([...footprints])
                });
                await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body });
                
                storage.set('ting-footprints', [...footprints]);
                storage.set('ting-user-id', uid);
                showToast('足跡雲端同步成功！');
                if(tab === 'footprints') render();
            } catch(e) {
                showToast('同步失敗，可能遇到跨域或網路問題');
                console.error(e);
            }
            $('#cloud-sync').innerText = '同步到雲端';
        }
        // ----------------------------------

        async function load() {
            $('#status').innerText = "讀取中...";
            try {
                const response = await fetch(DATA_URL, { cache: 'no-cache' });
                if (!response.ok) throw Error('HTTP ' + response.status);
                const d = await response.json();
                data = d;
                storage.set('ting-data-v1', d);
                $('#status').innerText = `已同步 (更新於 ${new Date(d.updatedAt || Date.now()).toLocaleDateString()})`;
                
                // 若有自動登入，背景嘗試拉取雲端足跡 (靜默)
                if(userId && GAS_URL !== '你的_GAS_網址_請替換') {
                    fetch(`${GAS_URL}?action=getUser&userId=${encodeURIComponent(userId)}`)
                        .then(r => r.json())
                        .then(j => {
                            if(j.success && j.data) {
                                JSON.parse(j.data).forEach(id => footprints.add(id));
                                storage.set('ting-footprints', [...footprints]);
                            }
                        }).catch(e=>{});
                }
                
                render();
            } catch (e) {
                const cached = storage.get('ting-data-v1', null);
                if (cached) {
                    data = cached;
                    $('#status').innerText = "離線模式 (載入快取)";
                    render();
                } else {
                    $('#content').innerHTML = '<div class="empty-state">無法載入資料，請檢查網路連接。</div>';
                }
            }
        }

        function renderFilters() {
            const bands = Object.keys(BANDS);
            let html = `<button class="filter-btn fb-all ${selectedBands.has('all') ? 'active' : ''}" data-band="all">全部</button>`;
            bands.forEach(id => {
                const isActive = selectedBands.has(id);
                html += `<button class="filter-btn fb-${id} ${isActive ? 'active' : ''}" data-band="${id}">${BANDS[id].name}</button>`;
            });
            $('#filters').innerHTML = html;
        }

        $('#filters').addEventListener('click', e => {
            const b = e.target.closest('.filter-btn');
            if (b) {
                const id = b.dataset.band;
                if (id === 'all') {
                    selectedBands.clear();
                    selectedBands.add('all');
                } else {
                    selectedBands.delete('all');
                    if (selectedBands.has(id)) {
                        selectedBands.delete(id);
                        if (selectedBands.size === 0) selectedBands.add('all');
                    } else {
                        selectedBands.add(id);
                    }
                }
                limit = 24;
                if (tab === 'calendar') {
                    renderCalendar(); // 行事曆支援動態過濾
                } else {
                    render();
                }
            }
        });

        document.querySelectorAll('.nav-item').forEach(el => {
            el.addEventListener('click', e => {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                e.target.classList.add('active');
                tab = e.target.dataset.tab;
                limit = 24;
                
                $('#footprints-actions').style.display = tab === 'footprints' ? 'block' : 'none';
                $('#search-bar-wrapper').style.display = tab === 'calendar' ? 'none' : 'flex';
                // 移除了原本行事曆會隱藏 filters 的邏輯，讓行事曆也能點選樂團
                $('#filters').style.display = tab === 'stats' ? 'none' : 'flex';
                
                const titles = { upcoming: '預告列表', calendar: '行事曆', events: '歷史歌單', stats: '歌曲統計', footprints: '我的現場足跡' };
                $('#tab-title').innerText = titles[tab];
                $('#section-title-wrap').style.display = tab === 'calendar' ? 'none' : 'flex';
                
                if (tab === 'calendar') {
                    $('#content').style.display = 'none';
                    $('#calendar-container').style.display = 'block';
                    $('#calendar-events-list').innerHTML = ''; // 清空下方列表
                    renderCalendar();
                } else {
                    $('#content').style.display = 'block';
                    $('#calendar-container').style.display = 'none';
                    render();
                }
            });
        });

        let debounceTimer;
        $('#search').addEventListener('input', e => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                query = e.target.value.trim().toLowerCase();
                limit = 24;
                render();
            }, 200);
        });

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            storage.set('ting-theme', isDark ? 'dark' : 'light');
            if(tab === 'calendar' && calendar) calendar.render(); 
        }
        if (storage.get('ting-theme') === 'dark') document.documentElement.classList.add('dark');

        function groupEvents(list) {
            const groupedMap = new Map();
            list.forEach(e => {
                const key = dateKey(e.date) + '|' + (e.location || '未定');
                if (!groupedMap.has(key)) {
                    groupedMap.set(key, {
                        originalIds: [], date: e.date, location: e.location, name: e.name, 
                        mapLink: e.mapLink, ticketUrl: e.ticketUrl, notes: [], bands: []
                    });
                }
                const group = groupedMap.get(key);
                group.originalIds.push(e.id);
                if (e.note && !group.notes.includes(e.note)) group.notes.push(e.note);
                if (!group.bands.find(b => b.id === e.band)) {
                    group.bands.push({ id: e.band, time: e.time, name: e.name, setlist: e.setlist || [] });
                }
            });
            return Array.from(groupedMap.values()).map(g => {
                g.bandIds = g.bands.map(b => b.id);
                g.totalSongs = g.bands.reduce((sum, b) => sum + b.setlist.length, 0);
                return g;
            });
        }

        function filterGrouped(list) {
            return list.filter(g => {
                const matchBand = selectedBands.has('all') || g.bandIds.some(b => selectedBands.has(b));
                if (!matchBand) return false;
                if (query) {
                    const text = [g.name, g.location, g.notes.join(' '), ...g.bands.map(b => bandInfo(b.id).name), ...g.bands.flatMap(b => b.setlist.map(s => s.songName))].join(' ').toLowerCase();
                    return text.includes(query);
                }
                return true;
            });
        }

        function toggleFootprint(idsStr, btn) {
            const ids = idsStr.split(',');
            const isActive = btn.classList.contains('active');
            ids.forEach(id => {
                if (isActive) footprints.delete(id);
                else footprints.add(id);
            });
            if (!storage.set('ting-footprints', [...footprints])) showToast('瀏覽器儲存失敗，請匯出備份');
            btn.classList.toggle('active');
            btn.innerText = isActive ? '＋ 足跡' : '✓ 足跡';
            if(tab === 'footprints') render();
        }

        window.toggleFootprint = toggleFootprint;
        window.toggleContent = function(el) {
            const content = el.nextElementSibling;
            content.classList.toggle('open');
            el.innerText = content.classList.contains('open') ? el.innerText.replace('▶', '▼') : el.innerText.replace('▼', '▶');
        };

        function buildCard(g, historical) {
            const k = dateKey(g.date);
            const map = safeUrl(g.mapLink), ticket = safeUrl(g.ticketUrl);
            const dayStr = getDayOfWeek(k);
            
            const bandsHtml = g.bands.map(b => `<span class="band-tag ${bandInfo(b.id).class}">${esc(bandInfo(b.id).short)}</span>`).join('');

            let notesHtml = '';
            let combinedNotes = [];
            g.bands.forEach(b => {
                if(b.time && b.time !== '未定') combinedNotes.push(`[${bandInfo(b.id).name}] 時間：${b.time}`);
            });
            combinedNotes = combinedNotes.concat(g.notes);
            
            if (combinedNotes.length > 0) {
                // 【修改】將備註內容中的 "活動網址：https://..." 轉為超連結格式
                const processedNotesHtml = combinedNotes.map(line => {
                    const match = line.match(/^(.*?)：(https?:\/\/[^\s]+)(.*)$/);
                    if (match) {
                        return `<a href="${esc(match[2])}" target="_blank" style="color:var(--text-main); font-weight:900; text-decoration:underline; word-break:break-all;">${esc(match[1])}</a>${esc(match[3])}`;
                    }
                    return esc(line).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:var(--text-main); font-weight:900; text-decoration:underline; word-break:break-all;">$1</a>');
                }).join('<br>');
                
                notesHtml = `
                <div class="cc-note-wrap">
                    <div class="cc-note-toggle" onclick="toggleContent(this)">▶ 查看活動資訊與時間</div>
                    <div class="cc-note-content">${processedNotesHtml}</div>
                </div>`;
            }

            let setlistsHtml = '';
            if (historical && g.totalSongs > 0) {
                setlistsHtml = `<div class="setlists-wrap"><div class="setlist-summary" onclick="toggleContent(this)">▶ 展開歷史歌單 (${g.totalSongs} 首)</div><div class="setlist-content">`;
                g.bands.forEach(b => {
                    if (b.setlist && b.setlist.length > 0) {
                        setlistsHtml += `<div class="sl-band-title">${esc(bandInfo(b.id).name)}</div>`;
                        b.setlist.forEach(s => {
                            setlistsHtml += `<div class="sl-song">${s.isEncore ? '<span style="background:var(--text-main);color:var(--bg-main);padding:1px 4px;font-size:9px;border-radius:2px;font-weight:900;">安可</span>' : ''} ${esc(s.songName)}</div>`;
                        });
                    }
                });
                setlistsHtml += `</div></div>`;
            }

            const isAttended = g.originalIds.some(id => footprints.has(id));
            const idsJoined = g.originalIds.join(',');
            let finalMapLink = map ? map : (g.location ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(g.location)}` : '');

            return `
            <div class="compact-card">
                <div class="cc-date">
                    <div class="m">${esc(k.slice(4,6))}月</div>
                    <div class="d">${esc(k.slice(6,8))}</div>
                    <div class="day">${dayStr}</div>
                </div>
                <div class="cc-info">
                    <div class="cc-title">${esc(g.name)}</div>
                    <div class="cc-meta">
                        ${finalMapLink ? `<a href="${esc(finalMapLink)}" target="_blank" style="color:inherit; text-decoration:underline;">📍 ${esc(g.location || '地點待公布')}</a>` : `📍 ${esc(g.location || '地點待公布')}`}
                    </div>
                    <div class="cc-bands">${bandsHtml}</div>
                    ${notesHtml}
                    ${setlistsHtml}
                    <div class="cc-actions">
                        ${ticket ? `<a href="${esc(ticket)}" target="_blank" class="cc-btn">購票</a>` : ''}
                        ${historical ? `<button class="cc-btn ${isAttended ? 'active' : ''}" onclick="toggleFootprint('${idsJoined}', this)">${isAttended ? '✓ 足跡' : '＋ 足跡'}</button>` : ''}
                    </div>
                </div>
            </div>`;
        }

        // 足跡分析畫面渲染
        function renderFootprintStats() {
            const attended = data.events.filter(e => footprints.has(e.id));
            if(attended.length === 0) {
                $('#footprints-analysis').innerHTML = `<div class="empty-state">尚未有足跡紀錄。先去「歷史歌單」找找你去過的現場吧！</div>`;
                return;
            }
            
            let bandsCount = new Map(), songCounts = new Map();
            attended.forEach(e => {
                bandsCount.set(e.band, (bandsCount.get(e.band)||0) + 1);
                if(e.setlist) e.setlist.forEach(s => songCounts.set(s.songName, (songCounts.get(s.songName)||0) + 1));
            });
            
            const topBand = [...bandsCount].sort((a,b)=>b[1]-a[1])[0]?.[0];
            const topSong = [...songCounts].sort((a,b)=>b[1]-a[1])[0]?.[0];
            const uniqueSongs = songCounts.size;
            
            $('#footprints-analysis').innerHTML = `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px;">
                <div style="background:var(--bg-card); border:2px solid var(--text-main); padding:16px; border-radius:8px; box-shadow:3px 3px 0px var(--text-main);">
                    <div style="font-size:11px; color:var(--text-secondary); font-weight:800;">參戰場次</div>
                    <div style="font-size:28px; font-weight:900; color:var(--text-main);">${attended.length} <span style="font-size:14px;">場</span></div>
                </div>
                <div style="background:var(--bg-card); border:2px solid var(--text-main); padding:16px; border-radius:8px; box-shadow:3px 3px 0px var(--text-main);">
                    <div style="font-size:11px; color:var(--text-secondary); font-weight:800;">解鎖歌曲</div>
                    <div style="font-size:28px; font-weight:900; color:var(--text-main);">${uniqueSongs} <span style="font-size:14px;">首</span></div>
                </div>
                <div style="grid-column:1/-1; background:var(--accent); border:2px solid var(--text-main); padding:16px; border-radius:8px; box-shadow:3px 3px 0px var(--text-main);">
                    <div style="font-size:11px; color:var(--text-main); font-weight:800;">你的靈魂最愛</div>
                    <div style="font-size:18px; font-weight:900; color:var(--text-main); margin-top:4px;">
                        👑 樂團：${bandInfo(topBand).name} <br>
                        🎵 歌曲：${esc(topSong || '無紀錄')}
                    </div>
                </div>
            </div>`;
        }

        function renderStats() {
            let list = data.events.filter(e => statsBand === 'all' || e.band === statsBand);
            let shows = list.filter(e => e.setlist && e.setlist.length > 0);
            let counts = new Map();
            shows.forEach(e => new Set(e.setlist.map(s => s.songName)).forEach(name => counts.set(name, (counts.get(name) || 0) + 1)));
            const songs = [...counts].sort((a, b) => b[1] - a[1]);

            let bandOpts = `<option value="all">全部</option>` + [...new Set(data.events.map(e => e.band))].map(id => `<option value="${esc(id)}" ${statsBand === id ? 'selected' : ''}>${esc(bandInfo(id).name)}</option>`).join('');

            let html = `
            <div class="stats-list">
                <select class="stats-select" onchange="statsBand=this.value; renderStats();">
                    ${bandOpts}
                </select>
                <div style="font-size: 11px; color: var(--text-secondary); margin-bottom: 16px; font-weight: 700;">母數為 ${shows.length} 場有歌單的演出。同場重複曲目只計一次。</div>
            `;
            if (songs.length === 0) {
                html += '<div class="empty-state">尚無歌單統計</div>';
            } else {
                songs.slice(0, 50).forEach(([name, count], idx) => {
                    const pct = shows.length ? (count / shows.length * 100).toFixed(1) : 0;
                    html += `
                    <div class="stat-row">
                        <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            <span style="color: var(--bg-main); font-weight: 900; margin-right: 4px; background:var(--text-main); padding: 2px 6px; border-radius: 4px;">#${idx+1}</span> 
                            ${esc(name)}
                        </div>
                        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${pct}%;"></div></div>
                        <div style="text-align: right;">${count}場</div>
                    </div>`;
                });
            }
            html += '</div>';
            $('#content').innerHTML = html;
        }

        function renderCalendarDateEvents(dateStr) {
            const clickedDate = dateStr.replace(/-/g, '');
            let sourceList = [...data.upcoming, ...data.events];
            let groupedList = groupEvents(sourceList).filter(g => dateKey(g.date) === clickedDate);
            // 套用目前上方過濾器的條件
            groupedList = filterGrouped(groupedList);
            
            let html = '<div class="events-grid" style="margin-top:20px;">';
            if (groupedList.length === 0) {
                html += '<div class="empty-state">這天沒有符合條件的演出行程。</div>';
            } else {
                const isHistorical = clickedDate < taipeiToday;
                groupedList.forEach(g => { html += buildCard(g, isHistorical); });
            }
            html += '</div>';
            
            $('#calendar-events-list').innerHTML = `
                <div class="section-title" style="margin-top:30px; padding-top:20px; border-top:2px dashed var(--text-main);">
                    <span>📌 ${dateStr.replace(/-/g, '/')} 現場清單</span>
                </div>
                ${html}
            `;
            $('#calendar-events-list').scrollIntoView({ behavior: 'smooth' });
        }
        
        function renderCalendar() {
            if (calendar) calendar.destroy();
            let calEvents = [];
            let allSourceList = [...data.upcoming, ...data.events];
            let groupedForCal = filterGrouped(groupEvents(allSourceList)); // 先過濾樂團
            
            groupedForCal.forEach(g => {
                const dateStr = g.date;
                if(dateStr.length === 8) {
                    const isoDate = `${dateStr.substring(0,4)}-${dateStr.substring(4,6)}-${dateStr.substring(6,8)}`;
                    g.bands.forEach(b => {
                        const bi = bandInfo(b.id);
                        // 【修改】只取地點的前兩個字 + 樂團代號 + 斷行顯示
                        const locPrefix = (g.location || '').substring(0, 2) || '未定';
                        calEvents.push({
                            title: `${locPrefix}\n[${bi.short}]`,
                            start: isoDate,
                            backgroundColor: bi.color,
                            borderColor: bi.color,
                            textColor: '#fff'
                        });
                    });
                }
            });

            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                locale: 'zh-tw',
                initialView: 'dayGridMonth',
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth' },
                events: calEvents,
                height: 'auto',
                contentHeight: 'auto',
                aspectRatio: 1.35,
                dateClick: function(info) { renderCalendarDateEvents(info.dateStr); },
                eventClick: function(info) { renderCalendarDateEvents(info.event.startStr); },
                windowResize: function(view) {
                    if (window.innerWidth < 768) {
                         calendar.setOption('aspectRatio', 0.8);
                         calendar.setOption('headerToolbar', { left: 'prev,next', center: 'title', right: 'today' });
                    } else {
                        calendar.setOption('aspectRatio', 1.35);
                        calendar.setOption('headerToolbar', { left: 'prev,next today', center: 'title', right: 'dayGridMonth' });
                    }
                }
            });
            calendar.render();
            if (window.innerWidth < 768) {
                 calendar.setOption('aspectRatio', 0.8);
                 calendar.setOption('headerToolbar', { left: 'prev,next', center: 'title', right: 'today' });
            }
        }

        function render() {
            if (tab === 'calendar') return;
            renderFilters();
            if (tab === 'stats') { $('#result-count').style.display = 'none'; renderStats(); return; }
            $('#result-count').style.display = 'inline-block';

            const historical = tab !== 'events' ? false : true;
            let sourceList = [];
            if(tab === 'upcoming') sourceList = data.upcoming.filter(e => dateKey(e.date) >= taipeiToday);
            else if (tab === 'events' || tab === 'footprints') sourceList = data.events;
            
            let groupedList = groupEvents(sourceList);
            groupedList = filterGrouped(groupedList);
            if (tab === 'footprints') {
                groupedList = groupedList.filter(g => g.originalIds.some(id => footprints.has(id)));
                renderFootprintStats(); // 渲染分析面板
            }

            groupedList.sort((a, b) => historical ? dateKey(b.date).localeCompare(dateKey(a.date)) : dateKey(a.date).localeCompare(dateKey(b.date)));
            $('#result-count').innerText = `${groupedList.length} 場`;

            let html = '<div class="events-grid">';
            if (groupedList.length === 0) {
                html += '<div class="empty-state">目前沒有符合條件的演出。</div>';
            } else {
                groupedList.slice(0, limit).forEach(g => { html += buildCard(g, tab === 'upcoming' ? false : true); });
            }
            html += '</div>';

            if (groupedList.length > limit) html += `<button class="btn-more" onclick="limit+=24; render();">載入更多 ↓</button>`;
            $('#content').innerHTML = html;
        }

        $('#export').addEventListener('click', () => {
            const blob = new Blob([JSON.stringify({ version: 1, ids: [...footprints] }, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = '聽團網-現場足跡.json'; a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        });

        $('#import').addEventListener('change', async e => {
            try {
                const file = e.target.files[0]; if (!file) return;
                const d = JSON.parse(await file.text());
                if (d.version !== 1 || !Array.isArray(d.ids)) throw Error('足跡格式錯誤');
                d.ids.forEach(id => footprints.add(id));
                storage.set('ting-footprints', [...footprints]);
                showToast('足跡已成功匯入！');
                render();
            } catch (err) { showToast(err.message); }
        });

        load();
    </script>
</body>
</html>
