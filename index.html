<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聽團網 — 下一場，在現場見。</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f4f5ef;
            --bg-card: #ffffff;
            --bg-subtle: #eeeee9;
            --text-main: #111111;
            --text-secondary: #555555;
            --accent: #d4f55a;
            --border: #111111;
        }
        html.dark {
            --bg-main: #0c0c0e;
            --bg-card: #141417;
            --bg-subtle: #1c1c21;
            --text-main: #f4f4f5;
            --text-secondary: #9898a0;
            --border: #f4f4f5;
            --accent: #d4f55a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; letter-spacing: -0.015em; }
        body { background: var(--bg-main); color: var(--text-main); padding-top: 118px; transition: background-color 0.3s, color 0.3s; overflow-x: hidden; }
        @media (min-width: 768px) { body { padding-top: 96px; } }
        
        .hero-grid { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: linear-gradient(to right, var(--text-main) 1px, transparent 1px), linear-gradient(to bottom, var(--text-main) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.05; pointer-events: none; z-index: -1; }
        html.dark .hero-grid { opacity: 0.1; }

        nav { position: fixed; top: 10px; left: 0.75rem; right: 0.75rem; max-width: 1200px; margin: 0 auto; background: var(--bg-card); border: 2px solid var(--text-main); z-index: 1000; box-shadow: 4px 4px 0px var(--text-main); display: flex; flex-direction: column; padding: 0.45rem 0.6rem; gap: 6px; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        nav.nav-hidden { transform: translateY(-150%); box-shadow: none; }
        
        .nav-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .nav-brand { font-size: 1.05rem; font-weight: 900; color: var(--text-main); text-transform: uppercase; letter-spacing: -0.5px; white-space: nowrap; }
        .nav-top-right { display: flex; align-items: center; gap: 6px; }
        
        /* 導航列使用者登入/匿名徽章 */
        .user-nav-btn { font-size: 0.72rem; font-weight: 900; background: var(--bg-subtle); color: var(--text-main); border: 2px solid var(--text-main); padding: 3px 9px; border-radius: 99px; cursor: pointer; box-shadow: 2px 2px 0px var(--text-main); display: inline-flex; align-items: center; gap: 5px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: transform 0.1s, background 0.2s; }
        .user-nav-btn.logged-in { background: var(--accent); color: #111; border-color: var(--text-main); }
        .user-nav-btn:active { transform: translate(2px, 2px); box-shadow: none; }
        .user-dot { width: 7px; height: 7px; border-radius: 50%; background: #888; flex-shrink: 0; }
        .user-nav-btn.logged-in .user-dot { background: #16a34a; box-shadow: 0 0 0 2px rgba(22,163,74,0.25); }

        .nav-links { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; border-top: 1.5px dashed var(--text-main); padding-top: 6px; }
        .nav-item { font-size: 0.72rem; font-weight: 800; text-align: center; padding: 5px 0; border: 1.5px solid var(--border); background: var(--bg-subtle); color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: all 0.2s;}
        .nav-item:hover { background: var(--text-main); color: var(--bg-main); }
        .nav-item.active { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); transform: translateY(-1px); box-shadow: 2px 2px 0px var(--accent);}
        .theme-btn { font-size: 0.72rem; font-weight: 900; background: var(--bg-subtle); border: 2px solid var(--text-main); padding: 3px 8px; cursor: pointer; box-shadow: 2px 2px 0px var(--text-main); transition: transform 0.1s; color: var(--text-main); white-space: nowrap; }
        .theme-btn:active { transform: translate(2px,2px); box-shadow: none; }
        
        @media (min-width: 768px) {
            nav { flex-direction: row; align-items: center; justify-content: space-between; padding: 0 1.25rem; height: 62px; }
            .nav-brand { font-size: 1.15rem; }
            .nav-links { display: flex; border-top: none; padding-top: 0; gap: 6px; }
            .nav-item { padding: 6px 12px; font-size: 0.82rem; border-width: 2px; }
            .user-nav-btn, .theme-btn { font-size: 0.78rem; padding: 4px 10px; }
        }

        .container { max-width: 1200px; margin: 0 auto 2rem auto; padding: 0 0.85rem; width: 100%; overflow-x: hidden; }
        
        /* 智慧型頂部精簡篩選列 */
        .filter-section { margin-bottom: 12px; }
        .filter-mode-hint { font-size: 0.68rem; font-weight: 800; color: var(--text-secondary); margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .filter-bar { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
        .filter-btn { font-size: 0.72rem; font-weight: 800; padding: 4px 10px; border: 1.5px solid var(--text-main); background: var(--bg-card); color: var(--text-main); cursor: pointer; border-radius: 99px; box-shadow: 1.5px 1.5px 0px var(--text-main); transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.12s, background 0.2s; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; line-height: 1.2; }
        .filter-btn:hover { transform: translate(-1px, -1px); box-shadow: 2.5px 2.5px 0px var(--text-main); }
        .filter-btn:active { transform: translate(1.5px, 1.5px); box-shadow: none; }
        .filter-count-pill { font-size: 0.62rem; font-weight: 900; padding: 0px 5px; border-radius: 99px; background: var(--bg-subtle); color: var(--text-secondary); border: 1px solid var(--border); }
        .filter-btn.active .filter-count-pill { background: rgba(0, 0, 0, 0.28); color: #fff; border-color: rgba(255, 255, 255, 0.4); }
        
        .explore-trigger-btn { font-size: 0.72rem; font-weight: 900; padding: 4px 11px; border: 1.5px solid var(--text-main); background: var(--accent); color: #111; cursor: pointer; border-radius: 99px; box-shadow: 2px 2px 0px var(--text-main); display: inline-flex; align-items: center; gap: 4px; transition: transform 0.12s, box-shadow 0.12s; white-space: nowrap; line-height: 1.2; }
        .explore-trigger-btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0px var(--text-main); }
        .explore-trigger-btn:active { transform: translate(1.5px, 1.5px); box-shadow: none; }
        
        .clear-filter-btn { font-size: 0.68rem; font-weight: 800; padding: 3px 9px; border: 1.5px dashed var(--text-main); background: transparent; color: var(--text-secondary); cursor: pointer; border-radius: 99px; transition: all 0.15s; line-height: 1.2; }
        .clear-filter-btn:hover { background: var(--bg-subtle); color: var(--text-main); }

        @media (min-width: 768px) {
            .filter-bar { gap: 7px; }
            .filter-btn, .explore-trigger-btn { font-size: 0.78rem; padding: 5px 13px; border-width: 2px; }
        }

        /* 彈出式通用遮罩與對話框 */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(12, 12, 14, 0.68); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 2500; display: none; align-items: center; justify-content: center; padding: 12px; animation: fadeIn 0.18s ease-out; }
        .modal-backdrop.open { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .artist-modal { width: 100%; max-width: 760px; max-height: 86vh; background: var(--bg-card); border: 3px solid var(--text-main); border-radius: 16px; box-shadow: 8px 8px 0px var(--text-main); display: flex; flex-direction: column; overflow: hidden; animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1); }
        .account-modal { max-width: 440px; }
        .am-header { padding: 14px 18px; background: var(--text-main); color: var(--bg-main); display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 2px solid var(--text-main); }
        .am-title-wrap h3 { font-size: 1rem; font-weight: 900; letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; }
        .am-title-wrap p { font-size: 0.72rem; opacity: 0.82; font-weight: 600; margin-top: 2px; }
        .am-close-btn { background: var(--bg-card); color: var(--text-main); border: 2px solid var(--bg-main); border-radius: 8px; padding: 3px 9px; font-weight: 900; font-size: 0.8rem; cursor: pointer; box-shadow: 2px 2px 0px var(--accent); flex-shrink: 0; }
        
        .am-controls { padding: 12px 18px; background: var(--bg-subtle); border-bottom: 2px dashed var(--text-main); display: flex; flex-direction: column; gap: 8px; }
        .am-search-wrap { position: relative; width: 100%; }
        .am-search-input { width: 100%; padding: 8px 12px; border: 2px solid var(--text-main); border-radius: 8px; background: var(--bg-card); color: var(--text-main); font-size: 0.85rem; font-weight: 700; box-shadow: 2px 2px 0px var(--text-main); }
        .am-search-input:focus { outline: none; box-shadow: 4px 4px 0px var(--accent); }
        
        .am-cat-tabs { display: flex; gap: 5px; flex-wrap: wrap; }
        .am-cat-btn { font-size: 0.74rem; font-weight: 800; padding: 5px 10px; border: 1.5px solid var(--text-main); border-radius: 8px; background: var(--bg-card); color: var(--text-secondary); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s; }
        .am-cat-btn:hover { color: var(--text-main); transform: translateY(-1px); }
        .am-cat-btn.active { background: var(--text-main); color: var(--bg-main); box-shadow: 2px 2px 0px var(--accent); }

        .am-list { padding: 14px 18px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; flex: 1; }
        @media (min-width: 640px) { .am-list { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; } }
        .am-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border: 2px solid var(--text-main); border-radius: 10px; background: var(--bg-card); cursor: pointer; transition: transform 0.12s, box-shadow 0.12s, background 0.15s; box-shadow: 2px 2px 0px var(--text-main); gap: 6px; user-select: none; }
        .am-item:hover { transform: translate(-1.5px, -1.5px); box-shadow: 3.5px 3.5px 0px var(--text-main); }
        .am-item.selected { background: var(--accent); color: #111; box-shadow: 2.5px 2.5px 0px var(--text-main); }
        .am-item-left { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; }
        .am-dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #111; flex-shrink: 0; }
        .am-name-box { min-width: 0; flex: 1; }
        .am-name { font-size: 0.8rem; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .am-sub { font-size: 0.64rem; font-weight: 700; opacity: 0.72; display: flex; align-items: center; gap: 3px; margin-top: 1px; }
        .am-badge { font-size: 0.68rem; font-weight: 900; padding: 2px 6px; border-radius: 99px; border: 1.5px solid var(--text-main); background: var(--bg-subtle); color: var(--text-main); white-space: nowrap; flex-shrink: 0; }
        .am-item.selected .am-badge { background: #111; color: var(--accent); border-color: #111; }

        .am-footer { padding: 10px 18px; background: var(--bg-card); border-top: 2px solid var(--text-main); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .am-selected-status { font-size: 0.75rem; font-weight: 800; color: var(--text-secondary); flex: 1; min-width: 160px; }

        .search-container { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; width: 100%; max-width: 100%; }
        @media (min-width: 768px) { .search-container { flex-direction: row; justify-content: space-between; align-items: center; } }
        .search-input { width: 100%; max-width: 100%; padding: 8px 12px; border: 2px solid var(--text-main); background: var(--bg-card); color: var(--text-main); font-size: 0.85rem; font-weight: 700; box-shadow: 3px 3px 0px var(--text-main); transition: box-shadow 0.2s; border-radius: 6px; }
        .search-input:focus { outline: none; box-shadow: 4px 4px 0px var(--accent); }
        @media (min-width: 768px) { .search-input { max-width: 320px; } }

        .events-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; width: 100%; }
        @media (min-width: 768px) { .events-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (min-width: 1024px) { .events-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .compact-card { display: flex; padding: 12px; gap: 12px; background: var(--bg-card); border: 2px solid var(--text-main); box-shadow: 4px 4px 0px var(--text-main); border-radius: 8px; align-items: flex-start; transition: transform 0.2s, box-shadow 0.2s; width: 100%; box-sizing: border-box; overflow: hidden; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;}
        .compact-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--text-main); }
        
        .cc-date { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--text-main); color: var(--bg-main); min-width: 52px; padding: 7px 4px; border-radius: 6px; flex-shrink: 0; }
        .cc-date .m { font-size: 11px; font-weight: 800; margin-bottom: 2px; }
        .cc-date .d { font-size: 20px; font-weight: 900; line-height: 1; letter-spacing: -1px;}
        .cc-date .day { font-size: 10px; font-weight: 800; margin-top: 3px; }
        
        .cc-info { flex: 1; min-width: 0; display: flex; flex-direction: column;}
        .cc-title { font-size: 15px; font-weight: 900; color: var(--text-main); line-height: 1.3; margin-bottom: 6px; word-wrap: break-word; }
        .cc-meta { font-size: 12.5px; color: var(--text-secondary); font-weight: 700; margin-bottom: 7px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .cc-bands { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
        
        .band-tag { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border: 1.5px solid var(--text-main); border-radius: 4px; display: inline-flex; align-items: center; white-space: nowrap; box-shadow: 1px 1px 0px rgba(0,0,0,0.1); transition: transform 0.15s;}
        /* 使用者選中的關注藝人色塊加上立體強調邊框 */
        .band-tag.is-picked { border: 2px solid var(--text-main); box-shadow: 2px 2px 0px var(--text-main); transform: translateY(-1px); font-weight: 900; }
        .b-default { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); }
        
        .cc-actions { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
        .cc-btn { font-size: 12px; font-weight: 800; padding: 5px 12px; border: 2px solid var(--text-main); background: var(--bg-card); color: var(--text-main); text-decoration: none; border-radius: 6px; cursor: pointer; box-shadow: 2px 2px 0px var(--text-main); transition: transform 0.1s, box-shadow 0.1s, background 0.2s; white-space: nowrap; }
        .cc-btn:hover { background: var(--text-main); color: var(--bg-main); }
        .cc-btn.active { background: var(--accent); color: #111; box-shadow: none; transform: translate(2px, 2px); border-color: var(--text-main); }

        .cc-note-wrap, .setlists-wrap { width: 100%; margin-top: 8px; }
        .cc-note-toggle, .setlist-summary { font-size: 11.5px; font-weight: 800; cursor: pointer; color: var(--text-main); padding: 3px 0; display: inline-block; text-decoration: underline; text-decoration-style: dashed; transition: color 0.2s;}
        .cc-note-toggle:hover, .setlist-summary:hover { color: var(--accent); }
        .cc-note-content, .setlist-content { font-size: 12px; color: var(--text-main); font-weight:600; background: var(--bg-subtle); padding: 8px 10px; border: 2px dashed var(--border); margin-top: 5px; line-height: 1.6; border-radius: 6px; white-space: pre-wrap; word-wrap: break-word; display: none; }
        .cc-note-content.open, .setlist-content.open { display: block; animation: slideUp 0.2s ease-out; }
        
        .sl-band-title { font-weight: 900; color: var(--text-main); margin: 8px 0 4px 0; border-bottom: 2px solid var(--border); padding-bottom: 4px; font-size:13px;}
        .sl-song { padding: 3px 0; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size:12px;}
        
        .section-title { font-size: 1.2rem; font-weight: 900; margin-bottom: 14px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; letter-spacing: -0.5px;}
        .empty-state { text-align: center; padding: 3.5rem 1rem; border: 2px dashed var(--text-main); background: var(--bg-card); border-radius: 12px; font-weight: 800; color: var(--text-secondary); grid-column: 1 / -1; width: 100%; }
        .btn-more { display: block; width: 100%; max-width: 220px; margin: 26px auto; text-align: center; font-size: 0.95rem; padding: 10px; font-weight: 900; background: var(--bg-card); border: 2px solid var(--text-main); box-shadow: 4px 4px 0px var(--text-main); cursor: pointer; color: var(--text-main); border-radius: 6px; transition: transform 0.1s;}
        .btn-more:active { transform: translate(4px, 4px); box-shadow: none; }
        
        #calendar-container { background: var(--bg-card); border: 2px solid var(--text-main); box-shadow: 5px 5px 0px var(--text-main); border-radius: 12px; padding: 12px; margin-top: 10px; width: 100%; overflow-x: auto; }
        .fc-theme-standard td, .fc-theme-standard th { border: 1px solid var(--border); }
        .fc-theme-standard .fc-scrollgrid { border: 2px solid var(--text-main); }
        .fc .fc-toolbar-title { font-weight: 900; color: var(--text-main); font-size: 1.15rem; letter-spacing:-0.5px;}
        .fc .fc-button-primary { background-color: var(--text-main); border-color: var(--text-main); color: var(--bg-main); font-weight: 800; box-shadow: 2px 2px 0px var(--accent); transition: all 0.2s;}
        .fc .fc-button-primary:hover { background-color: var(--text-secondary); border-color: var(--text-secondary); transform: translate(1px, 1px); box-shadow:1px 1px 0px var(--accent);}
        .fc .fc-daygrid-day-number { color: var(--text-main); font-weight: 900; }
        .fc .fc-col-header-cell-cushion { color: var(--text-main); font-weight: 900; padding: 8px 4px; }
        .fc-event { border: 1.5px solid var(--text-main); border-radius: 4px; padding: 2px !important; font-size: 10px; font-weight: 800; color: var(--text-main) !important; cursor: pointer; box-shadow: 1.5px 1.5px 0px var(--text-main); margin-bottom: 2px; white-space: normal !important; text-align: center; }
        
        html.dark .fc .fc-button-primary { color: var(--text-main); background-color: var(--bg-subtle); }
        html.dark .fc .fc-button-primary:hover { background-color: var(--text-main); color: var(--bg-main); }
        html.dark .fc-event { color: #111 !important; }
        
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: var(--bg-main); padding: 10px 20px; font-size: 13px; font-weight: 800; border-radius: 8px; z-index: 3000; box-shadow: 5px 5px 0px var(--accent); max-width: 90vw; text-align: center;}
    </style>
    <style id="dynamic-styles"></style>
</head>
<body>
    <div class="hero-grid"></div>
    <nav id="navbar">
        <div class="nav-top">
            <div class="nav-brand">聽團網 TING TUAN</div>
            <div class="nav-top-right">
                <button class="user-nav-btn" id="nav-user-btn" onclick="openAccountModal()" title="點擊設定雲端帳號與匿名暱稱">
                    <span class="user-dot"></span>
                    <span id="nav-user-label">登入足跡</span>
                </button>
                <button class="theme-btn" onclick="toggleTheme()">◑ 主題</button>
            </div>
        </div>
        <div class="nav-links">
            <div class="nav-item active" data-tab="upcoming">預告列表</div>
            <div class="nav-item" data-tab="calendar">行事曆</div>
            <div class="nav-item" data-tab="events">歷史歌單</div>
            <div class="nav-item" data-tab="stats">歌曲統計</div>
            <div class="nav-item" data-tab="footprints">我的足跡</div>
        </div>
    </nav>

    <div class="container">
        <div class="filter-section" id="filter-section">
            <div class="filter-mode-hint" id="filter-mode-hint"></div>
            <div class="filter-bar" id="filters"></div>
        </div>
        
        <div class="search-container" id="search-bar-wrapper">
            <input type="text" id="search" class="search-input" placeholder="搜尋活動、地點、藝人或歌曲...">
            <div id="status" style="font-size:10.5px; font-weight:800; color:var(--text-secondary); text-align:right;"></div>
        </div>
        
        <div class="section-title" id="section-title-wrap">
            <span id="tab-title">預告列表</span>
            <span id="result-count" style="font-size: 0.8rem; background: var(--text-main); color: var(--bg-main); padding: 2px 10px; border-radius: 20px; box-shadow:2px 2px 0px var(--accent);">0 場</span>
        </div>

        <div id="footprints-actions" style="display:none; margin-bottom: 20px;">
            <div style="background:var(--bg-card); border:2px dashed var(--text-main); padding:16px; border-radius:12px; margin-bottom:18px; box-shadow:4px 4px 0px var(--bg-subtle);">
                <div style="font-size:13.5px; font-weight:900; margin-bottom:10px; color:var(--text-main); display:flex; justify-content:space-between; align-items:center;">
                    <span>☁ 我的雲端帳號（自動同步足跡與關注藝人）</span>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
                    <div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwR49SJXjZM55RzbhpQyDv39sVM2J91U8BSs7gKlATQihm_QC60HOHH6FQtiA4CvLJexg/exec';
        const DATA_URL = './data.json';

        let BANDS_MAP = {}; 
        let rawBands = [];
        
        const DAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];
        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const storage = { get: (k, f) => { try { return JSON.parse(localStorage.getItem(k)) ?? f } catch { return f } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true } catch { return false } } };

        let data = { upcoming: [], events: [], bands: [] };

        const savedBandsArr = storage.get('ting-selected-bands', ['all']);
        let selectedBands = new Set(Array.isArray(savedBandsArr) && savedBandsArr.length > 0 ? savedBandsArr : ['all']);

        let modalCategory = 'all';
        let modalSearchQuery = '';
        
        let footprints = new Set(storage.get('ting-footprints', []));
        let userId = storage.get('ting-user-id', '');
        let userNickname = storage.get('ting-user-nickname', '');
        let calendar;
        let autoSyncTimer = null;

        const taipeiParts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()).map(p => [p.type, p.value]));
        const taipeiToday = taipeiParts.year + taipeiParts.month + taipeiParts.day;

        let lastScrollY = window.scrollY;
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;
            if (currentScrollY > lastScrollY && currentScrollY > 100) navbar.classList.add('nav-hidden');
            else navbar.classList.remove('nav-hidden');
            lastScrollY = currentScrollY;

        function normText(s) {
            let str = String(s || '');
            try { str = str.normalize('NFKC'); } catch (e) {}
            return str.trim();
        }

        function cleanVenueKey(loc) {
            const s = normText(loc).toLowerCase();
            if (!s || s === '未公布' || s === '未定' || s === '待公布') return '';
            return s
                .replace(/[《》「」『』【】\[\]()（）·・｜|：:\-_—\s。，、]/g, '')
                .replace(/台/g, '臺')
                .replace(/(臺北市|新北市|桃園市|臺中市|臺南市|高雄市|基隆市|新竹市|新竹縣|嘉義市|嘉義縣|苗栗縣|彰化縣|南投縣|雲林縣|屏東縣|宜蘭縣|花蓮縣|臺東縣|澎湖縣|金門縣)/g, '')
                .replace(/(區|鄉|鎮|市)/g, '');
        }

        function cleanEventTitleKey(title) {
            return normText(title).toLowerCase()
                .replace(/202\d\s*(年|年度)?/g, '')
                .replace(/\d+\s*(週年|周年|屆)/g, '')
                .replace(/[《》「」『』【】\[\]()（）·・｜|：:\-_—\s!！?？.。、]/g, '')
                .replace(/^(台北|臺北|新北|桃園|台中|臺中|台南|臺南|高雄|基隆|新竹|嘉義|苗栗|彰化|南投|雲林|屏東|宜蘭|花蓮|台東|臺東|澎湖|金門|馬祖)(市|縣)?/g, '')
                .replace(/(音樂祭|音樂節|演唱會|音樂會|生活節|開城|校慶|迎新|草地|派對|音樂季|主題日|市集)$/g, '');
        }

        function isSameFrontendEvent(group, item) {
            if (dateKey(group.date) !== dateKey(item.date)) return false;
            const vA = cleanVenueKey(group.location);
            const vB = cleanVenueKey(item.location);
            if (vA && vB && vA.length >= 2 && vB.length >= 2 && (vA === vB || vA.includes(vB) || vB.includes(vA))) {
                return true;
            }
            const tA = cleanEventTitleKey(group.name);
            const tB = cleanEventTitleKey(item.name);
            if (tA && tB && tA.length >= 2 && tB.length >= 2 && (tA === tB || tA.includes(tB) || tB.includes(tA))) {
                return true;
            }
            return false;
        }

        function openArtistModal() {
            $('#artist-modal-backdrop').classList.add('open');
            renderArtistModalContent();

        function closeArtistModal() {

        function openAccountModal() {
            $('#modal-user-id').value = userId || '';

        async function saveAccountFromModal() {
            const uid = $('#modal-user-id').value.trim();

                showToast('請輸入或隨機產生一個登入 ID！');

            userId = uid;
            userNickname = nick;
            $('#user-id-input').value = userId;
            $('#user-nick-input').value = userNickname;

            storage.set('ting-user-nickname', userNickname);

            $('#modal-login-btn').innerText = '同步中...';

            $('#modal-login-btn').innerText = '☁ 登入並同步';

        function logoutAccount() {
            userId = '';
            userNickname = '';
            storage.set('ting-user-id', '');
            storage.set('ting-user-nickname', '');

                btn.classList.add('logged-in');

        function setModalCategory(cat) {
            modalCategory = cat;
            renderArtistModalContent();
        }

        function persistBandSelection() {
            const arr = [...selectedBands];
            storage.set('ting-selected-bands', arr);
            scheduleSilentCloudPush();
        }

        function resetBandFilter() {
            selectedBands.clear();
            selectedBands.add('all');
            persistBandSelection();
            renderFilters();
            if ($('#artist-modal-backdrop').classList.contains('open')) {
                renderArtistModalContent();
            }
            limit = 24;
            if (tab === 'calendar') renderCalendar();
            else render();
        }

        function toggleFootprint(idsStr, btn) {
            const ids = idsStr.split(','), isActive = btn.classList.contains('active');
            ids.forEach(id => { if (isActive) footprints.delete(id); else footprints.add(id); });
            storage.set('ting-footprints', [...footprints]);
            btn.classList.toggle('active'); btn.innerText = isActive ? '＋ 足跡' : '✓ 足跡';
            scheduleSilentCloudPush();
            if(tab === 'footprints') render();
        }

        function toggleContent(el) {
            const content = el.nextElementSibling;
            content.classList.toggle('open');
            el.innerText = content.classList.contains('open') ? el.innerText.replace('▶', '▼') : el.innerText.replace('▼', '▶');
        }

        window.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                if ($('#artist-modal-backdrop').classList.contains('open')) closeArtistModal();
                else openArtistModal();
            } else if (e.key === 'Escape') {
                if ($('#artist-modal-backdrop').classList.contains('open')) closeArtistModal();
                if ($('#account-modal-backdrop').classList.contains('open')) closeAccountModal();
            }
        });
        $('#artist-modal-backdrop').addEventListener('click', closeArtistModal);
        $('#account-modal-backdrop').addEventListener('click', closeAccountModal);

        function dateKey(s) { return String(s || '').replace(/[-/]/g, '').replace(/\.0$/, ''); }
        function getDayOfWeek(dStr) { if (!dStr || dStr.length !== 8) return ''; return DAY_NAMES[new Date(dStr.slice(0,4), parseInt(dStr.slice(4,6))-1, dStr.slice(6,8)).getDay()]; }

        function inferArtistCategory(name, existingCat) {
            const validCats = ['樂團', '個人', '團體'];
            if (existingCat && validCats.includes(existingCat.trim())) return existingCat.trim();
            const n = normText(name);

            const knownBands = ['芒果醬', '美秀集團', '怕胖團', '冰球樂團', '公館青少年', '胡凱兒', '甜約翰', '溫蒂漫步', '好樂團', '溫室雜草', '無妄合作社', '康士坦的變化球', '血肉果汁機', '滅火器', '拍謝少年', '麋先生', '宇宙人', '告五人', '八三夭', '理想混蛋', '傻子與白痴', '草東沒有派對', '老王樂隊', '落日飛車', '傷心欲絕', '當代電影大師', '脆樂團', '庸俗救星', '福爾摩沙任務爵士樂團', '董事長樂團', '粗大BAND', '粹垢', '黑旋風', '火焰蟲樂團', '羊駝小姐', '壓滿俱樂部', '火星混蛋', '東部壞男孩', '眠氣', 'J Hall樂團', 'Control T', 'VH', 'TRASH'];
            const knownGroups = ['南西肯恩', 'U:NUS', 'F.F.O', 'Ozone', 'GX', 'ARKis', 'Saturnday', 'HUR+', '玖壹壹', 'TPE48', 'YOYO家族', 'A Tempo Quartet', '慶記KTV', '米棧不一樣舞團', '馬太鞍部落青年'];
            const knownSolos = ['盧廣仲', '婁峻碩', '呂允', '李浩瑋', '王謙', '派偉俊', '洪安妮', '吳蓓雅', '呂思緯', '鼓鼓', '白安', '黃妃', '品冠', '韋禮安', '周蕙', '羅時豐', '吳汶芳', '持修', '鄒序', '9M88', '閻奕格', '陳華', '曾瑋中', '呂士軒', '黃偉晉', '艾薇', '許效舜', '苗可麗', '澎恰恰', '王彩樺', '蔡旻佑', '吳淑敏', '羅巧倫', '邵大倫', '許志豪', '沈建豪', '黃新皓', '翁鈺鈞', '邱淑蟬', '林希子', '羅文裕', '李翊君', '陳以諾', '就以斯'];

            if (knownBands.some(k => n.toLowerCase().includes(k.toLowerCase()))) return '樂團';
            if (knownGroups.some(k => n.toLowerCase().includes(k.toLowerCase()))) return '團體';
            if (knownSolos.some(k => n.toLowerCase().includes(k.toLowerCase()))) return '個人';

            if (/樂團|樂隊|集團|團|Band|Club|社/i.test(n)) {
                if (/舞團|青年|家族|男團|女團|Quartet/i.test(n)) return '團體';
                return '樂團';
            }
            if (/[\u4e00-\u9fa5]/.test(n) && n.replace(/[A-Za-z\s.]/g, '').length <= 4) return '個人';
            if (/^(Juice Boy|163braces|Bu\$y|How Z|CHOLLY)$/i.test(n)) return '個人';
            return '樂團';
        }

        function bandInfo(id) { 
            if (BANDS_MAP[id]) return BANDS_MAP[id];
            let shortName = id;
            if (id.length > 2) {
                shortName = /^[a-zA-Z0-9_-]+$/.test(id) ? id.charAt(0).toUpperCase() : id.substring(0, 2);
            }
            return { name: id, short: shortName, color: 'var(--text-main)', class: 'b-default', category: '樂團', totalCount: 0, sortRank: 9999 }; 
        }
        
        function safeUrl(u) { try { const x = new URL(u); return x.protocol === 'https:' ? x.href : '' } catch { return '' } }
        function showToast(msg) { $('#toast').innerText = msg; $('#toast').style.display = 'block'; setTimeout(() => $('#toast').style.display = 'none', 3000); }

        if (userId) $('#user-id-input').value = userId;
        if (userNickname) $('#user-nick-input').value = userNickname;
        updateUserNavUI();

        function generateId() {
            const newId = 'USER_' + Math.random().toString(36).substring(2, 8).toUpperCase();
            $('#user-id-input').value = newId;
            userId = newId;
            storage.set('ting-user-id', newId);
            updateUserNavUI();
        }

        $('#user-id-input').addEventListener('change', e => {
            userId = e.target.value.trim();
            storage.set('ting-user-id', userId);
            updateUserNavUI();
        });

        $('#user-nick-input').addEventListener('change', e => {
            userNickname = e.target.value.trim();
            storage.set('ting-user-nickname', userNickname);
            updateUserNavUI();
            scheduleSilentCloudPush();
        });

        function buildCloudPayloadString() {
            return JSON.stringify({
                v: 2,
                nickname: userNickname || '',
                selectedBands: [...selectedBands],
                footprints: [...footprints]
            });
        }

        function applyCloudDataFromServer(rawJsonStr, preferCloudBands = true) {
            if (!rawJsonStr) return;
            try {
                const parsed = JSON.parse(rawJsonStr);
                if (Array.isArray(parsed)) {
                    parsed.forEach(id => footprints.add(id));
                } else if (parsed && typeof parsed === 'object') {
                    if (Array.isArray(parsed.footprints)) {
                        parsed.footprints.forEach(id => footprints.add(id));
                    }
                    if (parsed.nickname && !userNickname) {
                        userNickname = String(parsed.nickname).trim();
                        $('#user-nick-input').value = userNickname;
                        storage.set('ting-user-nickname', userNickname);
                    } else if (parsed.nickname && preferCloudBands) {
                        userNickname = String(parsed.nickname).trim();
                        $('#user-nick-input').value = userNickname;
                        storage.set('ting-user-nickname', userNickname);
                    }
                    if (Array.isArray(parsed.selectedBands) && parsed.selectedBands.length > 0) {
                        const localIsAll = selectedBands.size === 1 && selectedBands.has('all');
                        const cloudIsSpecific = !(parsed.selectedBands.length === 1 && parsed.selectedBands[0] === 'all');
                        if (preferCloudBands && (cloudIsSpecific || localIsAll)) {
                            selectedBands = new Set(parsed.selectedBands);
                            storage.set('ting-selected-bands', [...selectedBands]);
                        }
                    }
                }
                storage.set('ting-footprints', [...footprints]);
                updateUserNavUI();
            } catch (e) {}
        }

        function scheduleSilentCloudPush() {
            if (!userId || !GAS_URL.startsWith('https://script.google.com/')) return;
            clearTimeout(autoSyncTimer);
            autoSyncTimer = setTimeout(async () => {
                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        credentials: 'omit',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({
                            action: 'syncUser',
                            userId: userId,
                            data: buildCloudPayloadString()
                        })
                    });
                } catch (e) {}
            }, 1200);
        }

        async function cloudLoginAndSync() {
            const uid = $('#user-id-input').value.trim();
            const nick = $('#user-nick-input').value.trim();

                const getJson = await getRes.json();
                if(getJson.success && getJson.data && getJson.data !== "[]") {
                    const localHasCustomSelection = !selectedBands.has('all') && selectedBands.size > 0;
                    applyCloudDataFromServer(getJson.data, !localHasCustomSelection);

                        userNickname = nick;
                        $('#user-nick-input').value = userNickname;
                        storage.set('ting-user-nickname', userNickname);

                await fetch(GAS_URL, {
                    method: 'POST',
                    credentials: 'omit',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },

                        userId: uid,
                        data: buildCloudPayloadString()
                    })
                });

                else render();

            }

        }

        function enrichAndSortBands(bandsData, upcomingList, eventsList) {
            if(!bandsData || bandsData.length === 0) return [];
            const upcomingCounts = new Map();
            const historyCounts = new Map();

            (upcomingList || []).forEach(e => {
                if (dateKey(e.date) >= taipeiToday && e.band) {
                    upcomingCounts.set(e.band, (upcomingCounts.get(e.band) || 0) + 1);
                }
            });
            (eventsList || []).forEach(e => {
                if (e.band) {
                    historyCounts.set(e.band, (historyCounts.get(e.band) || 0) + 1);
                }
            });

            const enriched = bandsData.map((b, index) => {
                const uCount = upcomingCounts.get(b.id) || 0;
                const hCount = historyCounts.get(b.id) || 0;
                const totalCount = uCount + hCount;
                const category = inferArtistCategory(b.name, b.category);
                return {
                    ...b,
                    category,
                    upcomingCount: uCount,
                    historyCount: hCount,
                    totalCount,
                    originalOrder: index
                };
            });

            enriched.sort((a, b) => {
                if (b.totalCount !== a.totalCount) return b.totalCount - a.totalCount;
                if (b.upcomingCount !== a.upcomingCount) return b.upcomingCount - a.upcomingCount;
                return a.originalOrder - b.originalOrder;
            });

            BANDS_MAP = {};
            enriched.forEach((b, rankIdx) => {
                BANDS_MAP[b.id] = {
                    name: b.name,
                    short: b.short,
                    color: b.color,
                    category: b.category,
                    upcomingCount: b.upcomingCount,
                    historyCount: b.historyCount,
                    totalCount: b.totalCount,
                    sortRank: rankIdx,
                    class: 'b-' + b.id
                };
            });

            if (!selectedBands.has('all')) {
                const validSelected = [...selectedBands].filter(id => BANDS_MAP[id]);
                selectedBands = validSelected.length > 0 ? new Set(validSelected) : new Set(['all']);
                storage.set('ting-selected-bands', [...selectedBands]);
            }

            const gradientColors = enriched.slice(0, 6).map(b => b.color);
            let css = `
                @keyframes gradient-flow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
                .filter-btn.active.fb-all { 
                    background: linear-gradient(90deg, ${gradientColors.join(', ')}, ${gradientColors[0] || '#111'}); 
                    background-size: ${gradientColors.length * 100}% 100%; 
                    animation: gradient-flow ${Math.max(3, gradientColors.length)}s linear infinite; 
                    color: #fff; border-color: var(--text-main); 
                }
            `;
            enriched.forEach(b => {
                css += `
                .filter-btn.active.fb-${b.id} { background: ${b.color}; border-color: var(--text-main); color: #fff; transform: translate(1.5px, 1.5px); box-shadow: none; }
                .b-${b.id} { background: ${b.color}; border-color: transparent; color: #fff; }
                `;
            });
            $('#dynamic-styles').innerHTML = css;
            return enriched;
        }

        async function load() {
            $('#status').innerText = "讀取中...";
            try {
                const cacheBusterUrl = `${DATA_URL}?v=${new Date().getTime()}`;
                const response = await fetch(cacheBusterUrl, { cache: 'no-store' });
                
                if (!response.ok) throw Error('HTTP ' + response.status);
                const d = await response.json();
                data = d; storage.set('ting-data-v2', d);
                $('#status').innerText = `已同步 (更新於 ${new Date(d.updatedAt || Date.now()).toLocaleTimeString()})`;
                
                rawBands = enrichAndSortBands(d.bands || [], d.upcoming || [], d.events || []);
                renderFilters();
                render();

                if(userId && GAS_URL.startsWith('https://script.google.com/')) {
                    fetch(`${GAS_URL}?action=getUser&userId=${encodeURIComponent(userId)}&_t=${Date.now()}`, { credentials: 'omit' })
                        .then(r => r.json())
                        .then(j => {
                            if(j.success && j.data && j.data !== "[]") {
                                applyCloudDataFromServer(j.data, true);
                                enrichAndSortBands(d.bands || [], d.upcoming || [], d.events || []);
                                renderFilters();
                                if (tab === 'calendar') renderCalendar();
                                else render();
                            }
                        }).catch(e=>{});
                }
            } catch (e) {
                const cached = storage.get('ting-data-v2', null);
                if (cached) {
                    data = cached;
                    rawBands = enrichAndSortBands(cached.bands || [], cached.upcoming || [], cached.events || []);
                    $('#status').innerText = "離線模式 (載入快取)";
                    renderFilters(); render();
                } else {
                    $('#content').innerHTML = '<div class="empty-state">無法載入資料，請檢查網路連接。</div>';
                }
            }
        }

                html += `<button type="button" class="explore-trigger-btn" onclick="openArtistModal()">➕ 增減藝人 (共${rawBands.length}組)</button>`;
                html += `<button type="button" class="clear-filter-btn" onclick="resetBandFilter()">✕ 顯示全部</button>`;

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark'); storage.set('ting-theme', isDark ? 'dark' : 'light');
            if(tab === 'calendar' && calendar) calendar.render(); 
        }
        if (storage.get('ting-theme') === 'dark') document.documentElement.classList.add('dark');

        function groupEvents(list) {
            const groups = [];
            list.forEach(e => {
                let group = groups.find(g => isSameFrontendEvent(g, e));
                if (!group) {
                    group = {
                        originalIds: [],
                        date: e.date,
                        location: normText(e.location).replace(/_/g, ''),
                        name: normText(e.name),
                        mapLink: e.mapLink,
                        ticketUrl: e.ticketUrl,
                        notes: [],
                        bands: []
                    };
                    groups.push(group);
                } else {
                    const cleanName = normText(e.name);
                    if (cleanName && cleanName !== '未公布' && cleanName.length > group.name.length) {
                        group.name = cleanName;
                    }
                    const cleanLoc = normText(e.location).replace(/_/g, '');
                    if (cleanLoc && cleanLoc !== '未公布' && cleanLoc.length > group.location.length) {
                        group.location = cleanLoc;
                    }
                    if (!group.mapLink && e.mapLink) group.mapLink = e.mapLink;
                    if (!group.ticketUrl && e.ticketUrl) group.ticketUrl = e.ticketUrl;
                }
                group.originalIds.push(e.id);
                if (e.note && !group.notes.includes(e.note)) group.notes.push(e.note);
                const existingBand = group.bands.find(b => b.id === e.band);
                if (!existingBand) {
                    group.bands.push({ id: e.band, time: e.time, name: normText(e.name), setlist: e.setlist || [] });
                } else if ((!existingBand.time || existingBand.time === '未定' || existingBand.time === '未公布') && e.time && e.time !== '未定' && e.time !== '未公布') {
                    existingBand.time = e.time;
                }
            });
            return groups.map(g => {
                g.bandIds = g.bands.map(b => b.id);
                g.totalSongs = g.bands.reduce((sum, b) => sum + b.setlist.length, 0);
                return g;
            });
        }

        function filterGrouped(list) {
            return list.filter(g => {
                const matchBand = selectedBands.has('all') || g.bandIds.some(b => selectedBands.has(b));
                if (!matchBand) return false;
                if (query) { const text = [g.name, g.location, g.notes.join(' '), ...g.bands.map(b => bandInfo(b.id).name), ...g.bands.flatMap(b => b.setlist.map(s => s.songName))].join(' ').toLowerCase(); return text.includes(query); }
                return true;
            });
        }

        /**
         * ★ 修正重點 1：在活動卡片內，將「使用者勾選的關注藝人」永遠排在「藝人色塊列」與「藝人時間列」的最前面！
         */
        function buildCard(g, historical, idx = 0) {
            const k = dateKey(g.date), map = safeUrl(g.mapLink), ticket = safeUrl(g.ticketUrl), dayStr = getDayOfWeek(k);
            const isCustomFilter = !selectedBands.has('all') && selectedBands.size > 0;

            // 將有被使用者選中的藝人優先排在最前面；同為選中或同為未選中時，依熱門度 sortRank 排序
            const sortedBands = [...g.bands].sort((a, b) => {
                if (isCustomFilter) {
                    const aPicked = selectedBands.has(a.id) ? 1 : 0;
                    const bPicked = selectedBands.has(b.id) ? 1 : 0;
                    if (aPicked !== bPicked) return bPicked - aPicked;
                }
                return (bandInfo(a.id).sortRank ?? 9999) - (bandInfo(b.id).sortRank ?? 9999);
            });

            const bandsHtml = sortedBands.map(b => {
                const isPicked = isCustomFilter && selectedBands.has(b.id);
                return `<span class="band-tag ${bandInfo(b.id).class} ${isPicked ? 'is-picked' : ''}" title="${esc(bandInfo(b.id).name)} (${esc(bandInfo(b.id).category)})">${isPicked ? '★ ' : ''}${esc(bandInfo(b.id).short)}</span>`;
            }).join('');
            
            // 藝人演出時間同樣依照 sortedBands 順序（使用者選中的藝人時間永遠排在最前面）
            let combinedNotes = [];
            sortedBands.forEach(b => {
                if(b.time && b.time !== '未定' && b.time !== '未公布') {
                    const isPicked = isCustomFilter && selectedBands.has(b.id);
                    combinedNotes.push(`${isPicked ? '★ ' : ''}[${bandInfo(b.id).short}] 時間：${b.time}`);
                }
            });
            combinedNotes = combinedNotes.concat(g.notes);
            
            let notesHtml = '';
            if (combinedNotes.length > 0) {
                const processed = combinedNotes.map(line => {
                    const m = line.match(/^(.*?)：(https?:\/\/[^\s]+)(.*)$/);
                    if (m) return `<a href="${esc(m[2])}" target="_blank" style="color:var(--text-main); font-weight:900; text-decoration:underline;">${esc(m[1])}</a>${esc(m[3])}`;
                    return esc(line).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:var(--text-main); font-weight:900; text-decoration:underline;">$1</a>');
                }).join('<br>');
                notesHtml = `<div class="cc-note-wrap"><div class="cc-note-toggle" onclick="toggleContent(this)">▶ 查看活動資訊與時間</div><div class="cc-note-content">${processed}</div></div>`;
            }

            let setlistsHtml = '';
            if (historical && g.totalSongs > 0) {
                setlistsHtml = `<div class="setlists-wrap"><div class="setlist-summary" onclick="toggleContent(this)">▶ 展開歷史歌單 (${g.totalSongs} 首)</div><div class="setlist-content">`;
                sortedBands.forEach(b => {
                    if (b.setlist && b.setlist.length > 0) {
                        setlistsHtml += `<div class="sl-band-title">${esc(bandInfo(b.id).name)}</div>`;
                        b.setlist.forEach(s => { setlistsHtml += `<div class="sl-song">${s.isEncore ? '<span style="background:var(--text-main);color:var(--bg-main);padding:1px 5px;font-size:10px;border-radius:4px;font-weight:900;box-shadow:1px 1px 0px rgba(0,0,0,0.2);">安可</span>' : ''} ${esc(s.songName)}</div>`; });
                    }
                });
                setlistsHtml += `</div></div>`;
            }

            const isAttended = g.originalIds.some(id => footprints.has(id)), idsJoined = g.originalIds.join(',');
            let finalMapLink = map ? map : (g.location ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(g.location)}` : '');
            
            return `
            <div class="compact-card" style="animation-delay: ${idx * 0.04}s">
                <div class="cc-date"><div class="m">${esc(k.slice(4,6))}月</div><div class="d">${esc(k.slice(6,8))}</div><div class="day">${dayStr}</div></div>
                <div class="cc-info">
                    <div class="cc-title">${esc(g.name)}</div>
                    <div class="cc-meta">${finalMapLink ? `<a href="${esc(finalMapLink)}" target="_blank" style="color:inherit; text-decoration:underline;">📍 ${esc(g.location || '待公布')}</a>` : `📍 ${esc(g.location || '待公布')}`}</div>
                    <div class="cc-bands">${bandsHtml}</div>
                    ${notesHtml}${setlistsHtml}
                    <div class="cc-actions">
                        ${ticket ? `<a href="${esc(ticket)}" target="_blank" class="cc-btn">購票</a>` : ''}
                        ${historical ? `<button class="cc-btn ${isAttended ? 'active' : ''}" onclick="toggleFootprint('${idsJoined}', this)">${isAttended ? '✓ 足跡' : '＋ 足跡'}</button>` : ''}
                    </div>
                </div>
            </div>`;
        }

        function renderFootprintStats() {
            const attended = data.events.filter(e => footprints.has(e.id));
            if(attended.length === 0) { $('#footprints-analysis').innerHTML = `<div class="empty-state">尚未有足跡紀錄。先去「歷史歌單」找找你去過的現場吧！</div>`; return; }
            let bCount = new Map(), sCount = new Map();
            attended.forEach(e => { bCount.set(e.band, (bCount.get(e.band)||0) + 1); if(e.setlist) e.setlist.forEach(s => sCount.set(s.songName, (sCount.get(s.songName)||0) + 1)); });
            const topBand = [...bCount].sort((a,b)=>b[1]-a[1])[0]?.[0], topSong = [...sCount].sort((a,b)=>b[1]-a[1])[0]?.[0];
            
            $('#footprints-analysis').innerHTML = `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
                <div style="background:var(--bg-card); border:2px solid var(--text-main); padding:16px; border-radius:12px; box-shadow:4px 4px 0px var(--text-main);">

                </div>
                <div style="background:var(--bg-card); border:2px solid var(--text-main); padding:16px; border-radius:12px; box-shadow:4px 4px 0px var(--text-main);">
                    <div style="font-size:12px; color:var(--text-secondary); font-weight:900;">解鎖歌曲</div>
                    <div style="font-size:28px; font-weight:900; color:var(--text-main); margin-top:6px;">${sCount.size} <span style="font-size:14px;">首</span></div>
                </div>
                <div style="grid-column:1/-1; background:var(--accent); border:2px solid var(--text-main); padding:16px; border-radius:12px; box-shadow:4px 4px 0px var(--text-main);">
                    <div style="font-size:12px; color:#111; font-weight:900;">${esc(userNickname || userId || '我')} 的靈魂最愛</div>
                    <div style="font-size:18px; font-weight:900; color:#111; margin-top:6px; line-height:1.5;">👑 藝人：${bandInfo(topBand).name} <br>🎵 歌曲：${esc(topSong || '無')}</div>
                </div>
            </div>`;
        }

        function renderStats() {
            let list = data.events.filter(e => statsBand === 'all' || e.band === statsBand);
            let shows = list.filter(e => e.setlist && e.setlist.length > 0);
            let counts = new Map(); shows.forEach(e => new Set(e.setlist.map(s => s.songName)).forEach(name => counts.set(name, (counts.get(name) || 0) + 1)));
            const songs = [...counts].sort((a, b) => b[1] - a[1]);

            const groupedOpts = ['樂團', '團體', '個人'].map(cat => {
                const items = rawBands.filter(b => b.category === cat);
                if (items.length === 0) return '';
                return `<optgroup label="${cat}">` + items.map(b => `<option value="${esc(b.id)}" ${statsBand === b.id ? 'selected' : ''}>${esc(b.name)} (${b.totalCount}場)</option>`).join('') + `</optgroup>`;
            }).join('');

            let bandOpts = `<option value="all">全部藝人 (${rawBands.length}組)</option>` + groupedOpts;

            let html = `<div style="background:var(--bg-card); padding:20px; border:2px solid var(--text-main); box-shadow:5px 5px 0px var(--text-main); border-radius:12px; overflow-x:auto;">
                <select style="padding:10px; font-size:14px; font-weight:800; border:2px solid var(--text-main); border-radius:8px; box-shadow:3px 3px 0px var(--text-main); margin-bottom:16px; max-width:100%; background:var(--bg-card); color:var(--text-main);" onchange="statsBand=this.value; renderStats();">${bandOpts}</select>
                <div style="font-size:12px; color:var(--text-secondary); margin-bottom:16px; font-weight:800;">母數為 ${shows.length} 場有歌單的演出。同場重複曲目只計一次。</div>`;
            
            if (songs.length === 0) html += '<div class="empty-state">尚無歌單統計</div>';
            else songs.slice(0, 50).forEach(([name, count], idx) => {
                const pct = shows.length ? (count / shows.length * 100).toFixed(1) : 0;
                html += `<div style="display:grid; grid-template-columns:140px 1fr 50px; align-items:center; gap:14px; margin:14px 0; font-size:13px; font-weight:900; min-width:300px;">
                    <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"><span style="color:var(--bg-main); background:var(--text-main); padding:2px 7px; border-radius:6px; margin-right:6px;">#${idx+1}</span> ${esc(name)}</div>
                    <div style="height:12px; background:var(--bg-subtle); border-radius:10px; overflow:hidden; border:2px solid var(--text-main);"><div style="height:100%; background:var(--text-main); width:${pct}%;"></div></div>
                    <div style="text-align:right;">${count}場</div>
                </div>`;
            });
            $('#content').innerHTML = html + '</div>';
        }

        function renderCalendarDateEvents(dateStr) {
            const clickedDate = dateStr.replace(/-/g, '');
            let groupedList = filterGrouped(groupEvents([...data.upcoming, ...data.events])).filter(g => dateKey(g.date) === clickedDate);
            let html = '<div class="events-grid" style="margin-top:20px;">';
            if (groupedList.length === 0) html += '<div class="empty-state">這天沒有符合條件的演出行程。</div>';
            else groupedList.forEach((g, idx) => { html += buildCard(g, clickedDate < taipeiToday, idx); });
            $('#calendar-events-list').innerHTML = `<div class="section-title" style="margin-top:30px; padding-top:20px; border-top:2px dashed var(--text-main);"><span>📌 ${dateStr.replace(/-/g, '/')} 現場清單</span></div>${html}</div>`;
            $('#calendar-events-list').scrollIntoView({ behavior: 'smooth' });
        }
        
        /**
         * ★ 修正重點 2：當使用者只篩選特定藝人時，行事曆格子上「只會出現使用者選的藝人色塊」，不再出現同場未選中的藝人！
         */
        function renderCalendar() {
            if (calendar) calendar.destroy();
            let calEvents = [];
            const isAllMode = selectedBands.has('all') || selectedBands.size === 0;

            filterGrouped(groupEvents([...data.upcoming, ...data.events])).forEach(g => {
                if(g.date.length === 8) {
                    const isoDate = `${g.date.substring(0,4)}-${g.date.substring(4,6)}-${g.date.substring(6,8)}`;
                    // 在行事曆格子上，只渲染使用者有選中的藝人（若為全部模式則全部渲染）
                    const bandsForCalendar = isAllMode
                        ? g.bands
                        : g.bands.filter(b => selectedBands.has(b.id));

                    bandsForCalendar.forEach(b => {
                        const bi = bandInfo(b.id);
                        calEvents.push({
                            title: `${(g.location || '').substring(0, 2) || '未定'}\n[${bi.short}]`,
                            start: isoDate,
                            backgroundColor: bi.color,
                            borderColor: bi.color,
                            textColor: '#fff'
                        });
                    });
                }
            });

            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                locale: 'zh-tw', initialView: 'dayGridMonth', headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth' },
                events: calEvents, height: 'auto', contentHeight: 'auto', aspectRatio: 1.35,
                dateClick: info => renderCalendarDateEvents(info.dateStr), eventClick: info => renderCalendarDateEvents(info.event.startStr),
                windowResize: function() {
                    calendar.setOption('aspectRatio', window.innerWidth < 768 ? 0.8 : 1.35);
                    calendar.setOption('headerToolbar', window.innerWidth < 768 ? { left: 'prev,next', center: 'title', right: 'today' } : { left: 'prev,next today', center: 'title', right: 'dayGridMonth' });
                }
            });
            calendar.render(); if(window.innerWidth < 768) { calendar.setOption('aspectRatio', 0.8); calendar.setOption('headerToolbar', { left: 'prev,next', center: 'title', right: 'today' }); }
        }

        function render() {
            if (tab === 'calendar') return;
            if (tab === 'stats') { $('#result-count').style.display = 'none'; renderStats(); return; }
            $('#result-count').style.display = 'inline-block';

            const historical = tab !== 'events' ? false : true;
            let sourceList = tab === 'upcoming' ? data.upcoming.filter(e => dateKey(e.date) >= taipeiToday) : data.events;
            let groupedList = filterGrouped(groupEvents(sourceList));
            
            if (tab === 'footprints') { groupedList = groupedList.filter(g => g.originalIds.some(id => footprints.has(id))); renderFootprintStats(); }

            groupedList.sort((a, b) => historical ? dateKey(b.date).localeCompare(dateKey(a.date)) : dateKey(a.date).localeCompare(dateKey(b.date)));
            $('#result-count').innerText = `${groupedList.length} 場`;

            let html = '<div class="events-grid">';
            if (groupedList.length === 0) html += '<div class="empty-state">目前沒有符合條件的演出。</div>';
            else groupedList.slice(0, limit).forEach((g, idx) => { html += buildCard(g, tab === 'upcoming' ? false : true, idx); });
            html += '</div>';

            if (groupedList.length > limit) html += `<button class="btn-more" onclick="limit+=24; render();">載入更多 ↓</button>`;
            $('#content').innerHTML = html;
        }

        $('#export').addEventListener('click', () => {
            const blob = new Blob([JSON.stringify({
                version: 2,
                nickname: userNickname,
                selectedBands: [...selectedBands],
                ids: [...footprints]
            }, null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '聽團網-現場足跡與偏好.json'; a.click();
        });

        $('#import').addEventListener('change', async e => {
            try {
                const file = e.target.files[0]; if (!file) return; const d = JSON.parse(await file.text());
                if (!Array.isArray(d.ids)) throw Error('格式錯誤');
                d.ids.forEach(id => footprints.add(id));
                storage.set('ting-footprints', [...footprints]);
                if (Array.isArray(d.selectedBands) && d.selectedBands.length > 0) {
                    selectedBands = new Set(d.selectedBands);
                    storage.set('ting-selected-bands', [...selectedBands]);
                }
                if (d.nickname) {
                    userNickname = String(d.nickname).trim();
                    $('#user-nick-input').value = userNickname;
                    storage.set('ting-user-nickname', userNickname);
                    updateUserNavUI();
                }
                scheduleSilentCloudPush();
                renderFilters();
                showToast('匯入成功！'); render();
            } catch (err) { showToast(err.message); }
        });

        load();
    </script>
</body>
</html>
