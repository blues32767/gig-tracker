<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d4f55a"><meta name="description" content="聽團網：探索獨立音樂演出、跨樂團行事曆與歷史歌單，收藏你的現場足跡。"><title>聽團網 — 下一場，在現場見。</title>
<style>
:root{color-scheme:light;--bg:#f5f4ee;--panel:#fffef9;--ink:#20221d;--muted:#64665d;--line:#d5d6cc;--accent:#d4f55a;--soft:#e9eadd;--shadow:0 14px 45px #20221d0d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Noto Sans TC",sans-serif}body.dark{color-scheme:dark;--bg:#151712;--panel:#20231c;--ink:#f2f3e9;--muted:#b2b8a8;--line:#414638;--soft:#2c3225;--shadow:none}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}a{color:inherit;text-underline-offset:4px}button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:50px;padding:10px 19px;min-height:44px;transition:background .18s,transform .18s}button:hover{background:var(--soft)}button:active{transform:scale(.98)}:focus-visible{outline:3px solid #788d18;outline-offset:4px}.primary,button[aria-pressed=true]{background:var(--accent);color:#20221d;border-color:#a8c43c}.skip{position:fixed;top:-100px;z-index:100;background:var(--accent);padding:12px}.skip:focus{top:0}.header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:20;transition:transform .28s ease}.header-inner{max-width:1320px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:16px 30px;gap:15px}.brand{font-weight:900;font-size:25px;text-decoration:none;letter-spacing:-1px}.brand small{font-size:10px;letter-spacing:2px;display:block;line-height:1}.nav{display:flex;gap:8px}.nav button{border:0;border-radius:8px;background:transparent;padding:9px 14px}.nav button[aria-selected=true]{background:var(--ink);color:var(--bg)}.theme{font-size:14px}main{max-width:1320px;padding:0 30px 70px;margin:auto}.hero{padding:65px 0 45px;display:grid;grid-template-columns:1.5fr 1fr;gap:30px;border-bottom:1px solid var(--line)}.eyebrow{font:700 11px/1.5 ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(45px,6.5vw,90px);line-height:1.13;letter-spacing:-.07em;margin:22px 0 0;font-weight:900}h1 em{font-style:normal;position:relative}h1 em::after{content:"";position:absolute;bottom:3px;left:0;width:100%;height:9px;background:var(--accent);z-index:-1}.hero-aside{align-self:end;border-left:1px solid var(--line);padding:0 0 0 30px}.hero-aside p{font-size:18px;margin:0 0 25px}.counter{font-size:45px;line-height:1.2;letter-spacing:-2px;font-weight:800}.status{color:var(--muted);font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}.status button{padding:4px 12px;min-height:32px;font-size:12px}.tools{padding:25px 0;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{font-size:13px;padding:8px 15px}.search{min-width:230px;display:flex;gap:8px;align-items:center}.search input{width:100%;border:1px solid var(--line);border-radius:50px;background:var(--panel);color:var(--ink);padding:11px 17px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:20px 0 25px}h2{margin:0;font-size:28px;letter-spacing:-1px}.view-toggle{display:flex;gap:5px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:25px;min-width:0;box-shadow:var(--shadow);position:relative;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:var(--muted)}.card-top{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:35px}.date{font-size:36px;letter-spacing:-2px;font-weight:850;line-height:1.2}.date small{display:block;font:500 12px/1.8 ui-monospace,monospace;letter-spacing:1px;color:var(--muted)}.tag{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:50px;overflow-wrap:anywhere}.card h3{font-size:22px;line-height:1.4;margin:0 0 15px;overflow-wrap:anywhere}.meta{font-size:14px;color:var(--muted);overflow-wrap:anywhere}.meta p{margin:6px 0}.note{white-space:pre-wrap;font-size:13px;color:var(--muted);overflow-wrap:anywhere;max-height:9em;overflow:auto}.card-actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:17px;margin-top:20px}.card-actions a,.card-actions button{font-size:13px;min-height:40px;padding:7px 12px;border:1px solid var(--line);border-radius:30px;text-decoration:none;display:inline-flex;align-items:center}.card details{border-top:1px solid var(--line);margin-top:15px;padding-top:12px}summary{cursor:pointer;font-size:14px;min-height:44px;padding:8px 0}.song-list{padding-left:25px;font-size:14px}.song-list li{padding:5px 0;overflow-wrap:anywhere}.song-list a{font-size:12px;margin-left:8px}.empty{padding:70px 20px;text-align:center;border:1px dashed var(--line);border-radius:16px;grid-column:1/-1;color:var(--muted)}.load-more{display:block;margin:30px auto}.skeleton{min-height:330px;overflow:hidden}.skeleton::after{content:"";display:block;width:100%;height:240px;border-radius:12px;background:linear-gradient(110deg,var(--soft) 30%,var(--panel) 45%,var(--soft) 60%);background-size:250% 100%;animation:shimmer 1.6s infinite}@keyframes shimmer{to{background-position:-150% 0}}.calendar{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}.cal-top{padding:20px;display:flex;justify-content:space-between;align-items:center}.cal-top div{display:flex;gap:8px}.cal-top h3{margin:0;font-size:22px}.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.cal-week{background:var(--soft);font-size:12px;text-align:center;padding:8px 0}.cal-day{border:0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;min-width:0;min-height:150px;padding:9px;text-align:left;display:flex;flex-direction:column;gap:5px;justify-content:start}.cal-day:nth-child(7n){border-right:0}.cal-day.blank{background:var(--bg)}.cal-day.today .day-number{background:var(--ink);color:var(--bg);border-radius:30px;padding:0 6px}.day-number{font:600 13px/1.7 ui-monospace,monospace;align-self:start}.cal-event{display:block;max-width:100%;min-width:0;border-radius:6px;background:var(--soft);font-size:11px;line-height:1.5;padding:6px;overflow:hidden}.cal-event strong,.cal-event span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.band-short{display:none}.cal-help{font-size:12px;color:var(--muted);margin-top:10px}.stats-list{background:var(--panel);padding:25px;border:1px solid var(--line);border-radius:18px}.stat{display:grid;grid-template-columns:180px 1fr 65px;align-items:center;gap:20px;margin:16px 0;font-size:14px}.stat-name{overflow-wrap:anywhere}.bar{height:7px;background:var(--soft);border-radius:10px;overflow:hidden}.bar i{display:block;background:#80982f;height:100%}.stats-list select{background:var(--bg);color:var(--ink);padding:10px;border:1px solid var(--line);border-radius:6px;max-width:100%}.foot-note{color:var(--muted);font-size:13px;max-width:650px}footer{border-top:1px solid var(--line);padding:25px 0;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:20px}dialog{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--ink);padding:28px;max-width:640px;width:calc(100% - 30px);max-height:85vh;overflow:auto}dialog::backdrop{background:#12161088;backdrop-filter:blur(4px)}dialog .dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}dialog .card{box-shadow:none;margin:12px 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 22px;z-index:100;max-width:calc(100% - 32px);font-size:14px}.hidden,[hidden]{display:none!important}.fade{animation:fade .25s ease}@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:960px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1.4fr 1fr}.header-inner{padding:14px 24px}.nav{gap:0}.nav button{font-size:14px;padding:9px 10px}.cal-day{min-height:125px}}
@media(max-width:640px){main{padding:0 16px 40px}.header-inner{padding:12px 16px;flex-wrap:wrap;gap:10px}.brand{font-size:22px}.nav{order:3;width:100%;justify-content:space-between}.nav button{flex:1;font-size:13px;padding:8px 6px}.header.is-hidden{transform:translateY(-105%)}.hero{padding:38px 0 28px;grid-template-columns:1fr;gap:28px}h1{font-size:51px}.hero-aside{border:0;padding:0;display:flex;align-items:center;justify-content:space-between;gap:20px}.hero-aside p{font-size:14px;margin:0}.counter{font-size:32px;white-space:nowrap}.hero-aside .eyebrow{font-size:10px}.tools{padding:20px 0;gap:16px}.search{width:100%}.grid{grid-template-columns:1fr;gap:14px}.card{padding:23px}.card-top{margin-bottom:24px}.section-head{flex-wrap:wrap}h2{font-size:24px}.view-toggle button{font-size:13px;padding:8px 13px}.cal-top{padding:12px}.cal-top h3{font-size:18px}.cal-top button{padding:6px 12px}.cal-day{min-height:104px;padding:4px;gap:4px}.cal-event{font-size:10px;padding:3px 2px}.band-full{display:none}.band-short{display:inline}.cal-event span{font-size:9px}.stat{grid-template-columns:100px 1fr 55px;gap:10px;font-size:12px}.stats-list{padding:18px}.card:hover{transform:none}footer{flex-direction:column;gap:4px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</head><body><a class="skip" href="#main">跳至主要內容</a>
<header class="header" id="header"><div class="header-inner"><a class="brand" href="./">聽團網<span aria-hidden="true"> ↗</span><small>LIVE / LOUD / TOGETHER</small></a><nav class="nav" aria-label="主要導覽"><button data-tab="upcoming" aria-selected="true">演出預告</button><button data-tab="events" aria-selected="false">歷史歌單</button><button data-tab="stats" aria-selected="false">歌曲統計</button><button data-tab="footprints" aria-selected="false">我的足跡</button></nav><button class="theme" id="theme" aria-label="切換深色模式">◐ 主題</button></div></header>
<main id="main"><section class="hero"><div><div class="eyebrow">INDEPENDENT MUSIC FIELD NOTES / TAIWAN</div><h1>下一場，<br>在<em>現場</em>見。</h1></div><div class="hero-aside"><p>從第一首到最後一次安可。<br>把喜歡的樂團，排進你的生活。</p><div><div class="counter" id="counter">—</div><div class="eyebrow">SHOWS TO DISCOVER</div></div></div></section>
<div class="status" role="status" id="status">正在讀取演出資訊…</div><div class="tools"><div class="filters" id="filters" aria-label="樂團篩選"></div><label class="search"><input id="search" type="search" aria-label="搜尋活動、地點或歌曲" placeholder="搜尋活動、地點、歌曲…"></label></div>
<section id="content" aria-live="polite" aria-busy="true"><div class="grid"><div class="card skeleton"></div><div class="card skeleton"></div><div class="card skeleton"></div></div></section>
<footer><span>聽團網 / 為每一次現場，留一個位置。</span><span>活動異動請以主辦單位公告為準。</span></footer></main>
<dialog id="detail"><div class="dialog-head"><h2 id="detail-title">演出詳情</h2><button id="close-detail" aria-label="關閉詳情">關閉 ×</button></div><div id="detail-body"></div></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
// Relative URL supports both github.io and github.io/repository/ deployment.
const DATA_URL='./data.json';
const BANDS={mango:{name:'芒果醬',short:'芒'},bisiugroup:{name:'美秀集團',short:'美'},papunband:{name:'怕胖團',short:'怕'},icyball:{name:'冰球樂團',short:'冰'},gongguan:{name:'公館青少年',short:'公'}};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storage={get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}};
let data={upcoming:[],events:[],songsMap:{}}, tab='upcoming',view='list',query='',band='all',limit=24,loading=false,statsBand='all';
const taipeiParts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(p=>[p.type,p.value]));
const taipeiToday=taipeiParts.year+taipeiParts.month+taipeiParts.day;
let month=new Date(+taipeiToday.slice(0,4),+taipeiToday.slice(4,6)-1,1), footprints=new Set(storage.get('ting-footprints',[]));
function bandInfo(id){return BANDS[id]||{name:id,short:Array.from(id||'?')[0]};}
function dateKey(s){return String(s||'').replace(/[-/]/g,'').replace(/\.0$/,'');}
function goodData(d){return d&&d.schemaVersion===1&&Array.isArray(d.upcoming)&&Array.isArray(d.events)&&d.events.concat(d.upcoming).every(e=>e&&typeof e.name==='string'&&/^\d{8}$/.test(dateKey(e.date)));}
function safeUrl(u){try{const x=new URL(u);return x.protocol==='https:'?x.href:''}catch{return ''}}
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,4500);}
async function load(){if(loading)return;loading=true;$('#content').setAttribute('aria-busy','true');
 try{const response=await fetch(DATA_URL,{cache:'no-cache',signal:AbortSignal.timeout(15000)});if(!response.ok)throw Error('HTTP '+response.status);const d=await response.json();if(!goodData(d))throw Error('快取格式不正確');data=d;storage.set('ting-data-v1',d);showStatus(false);render();}
 catch(e){const cached=storage.get('ting-data-v1',null);if(goodData(cached)){data=cached;showStatus(true);render();}else{$('#status').innerHTML='資訊暫時無法載入。<button id="retry">重新載入</button>';$('#retry').onclick=load;$('#content').innerHTML='<div class="empty">請檢查網路，或稍後重新載入。</div>';}}
 finally{loading=false;$('#content').setAttribute('aria-busy','false');}}
function showStatus(stale){const stamp=data.updatedAt?new Date(data.updatedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'尚未同步';$('#status').innerHTML=`<span>${stale?'離線備份 · ':''}資料更新 ${esc(stamp)}（臺灣時間）</span><button id="refresh">重新整理</button>`;$('#refresh').onclick=load;}
function filter(list){return list.filter(e=>(band==='all'||e.band===band)&&(!query||[e.name,e.location,bandInfo(e.band).name,e.note,...(e.setlist||[]).map(s=>s.songName)].join(' ').toLocaleLowerCase().includes(query)));}
function renderFilters(){const ids=[...new Set(Object.keys(BANDS).concat(data.upcoming.concat(data.events).map(e=>e.band)))];$('#filters').innerHTML=[['all','全部樂團'],...ids.map(id=>[id,bandInfo(id).name])].map(([id,name])=>`<button data-band="${esc(id)}" aria-pressed="${band===id}">${esc(name)}</button>`).join('');}
function card(e,historical=false){const b=bandInfo(e.band),k=dateKey(e.date), map=safeUrl(e.mapLink),ticket=safeUrl(e.ticketUrl);const id=e.id;return `<article class="card"><div class="card-top"><div class="date"><small>${esc(k.slice(0,4))} / ${esc(e.time||'時間未定')}</small>${esc(k.slice(4,6))}.${esc(k.slice(6,8))}</div><span class="tag">${esc(b.name)}</span></div><h3>${esc(e.name)}</h3><div class="meta"><p>↗ ${esc(e.location||'地點待公布')}</p></div>${e.note?`<p class="note">${esc(e.note)}</p>`:''}${historical?`<details><summary>演出歌單 · ${(e.setlist||[]).length} 首</summary><ol class="song-list">${(e.setlist||[]).map(s=>{const info=data.songsMap?.[s.songId]||data.songsMap?.[e.band+'/'+s.songName]||{},url=safeUrl(info.spotify)||safeUrl(info.youtubeMv);return `<li>${s.isEncore?'安可 · ':''}${esc(s.songName)}${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">聆聽 ↗</a>`:''}</li>`}).join('')||'<li>尚未收錄歌單</li>'}</ol></details>`:''}<div class="card-actions">${map?`<a href="${esc(map)}" target="_blank" rel="noopener noreferrer">地圖 ↗</a>`:''}${ticket?`<a href="${esc(ticket)}" target="_blank" rel="noopener noreferrer">購票 ↗</a>`:''}${historical?`<button data-foot="${esc(id)}" aria-pressed="${footprints.has(id)}">${footprints.has(id)?'✓ 已留下足跡':'＋ 我在現場'}</button>`:''}</div></article>`;}
function render(){renderFilters();$('#counter').textContent=data.upcoming.filter(e=>dateKey(e.date)>=taipeiToday).length.toLocaleString();$('#content').classList.remove('fade');void $('#content').offsetWidth;$('#content').classList.add('fade');
 if(tab==='stats'){renderStats();return;}
 const historical=tab!=='upcoming';let list=historical?data.events:data.upcoming.filter(e=>dateKey(e.date)>=taipeiToday);
 if(tab==='footprints')list=list.filter(e=>footprints.has(e.id));list=filter(list).sort((a,b)=>historical?dateKey(b.date).localeCompare(dateKey(a.date)):dateKey(a.date).localeCompare(dateKey(b.date)));
 const title={upcoming:'演出預告',events:'歷史歌單',footprints:'我的現場足跡'}[tab];
 $('#content').innerHTML=`<div class="section-head"><h2>${title} <span class="eyebrow">/ ${list.length}</span></h2>${!historical?`<div class="view-toggle"><button data-view="list" aria-pressed="${view==='list'}">列表</button><button data-view="calendar" aria-pressed="${view==='calendar'}">行事曆</button></div>`:''}</div>${tab==='footprints'?'<p class="foot-note">足跡保存在這台裝置的瀏覽器。清除網站資料後會消失；可匯出 JSON 備份，再於其他裝置匯入。</p><div class="filters"><button id="export">匯出足跡</button><label><input type="file" id="import" accept="application/json" hidden><button id="import-btn">匯入足跡</button></label></div><br>':''}`;
 if(!historical&&view==='calendar'){renderCalendar(list);return;}
 $('#content').insertAdjacentHTML('beforeend',`<div class="grid">${list.slice(0,limit).map(e=>card(e,historical)).join('')||'<div class="empty">目前沒有符合條件的演出。試著更換樂團或搜尋文字。</div>'}</div>${list.length>limit?'<button id="more" class="load-more">顯示更多演出 ↓</button>':''}`);
 if($('#more'))$('#more').onclick=()=>{limit+=24;render()};
 if(tab==='footprints'){$('#export').onclick=exportFootprints;$('#import-btn').onclick=()=>$('#import').click();$('#import').onchange=importFootprints;}}
function renderCalendar(list){const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<div class="cal-day blank" aria-hidden="true"></div>';
 for(let day=1;day<=days;day++){const key=`${y}${String(m+1).padStart(2,'0')}${String(day).padStart(2,'0')}`,events=list.filter(e=>dateKey(e.date)===key);cells+=`<button class="cal-day ${key===taipeiToday?'today':''}" data-day="${key}" aria-label="${y}年${m+1}月${day}日，${events.length}場演出"><span class="day-number">${day}</span>${events.slice(0,2).map(e=>{const b=bandInfo(e.band);return `<span class="cal-event" title="${esc(b.name+' · '+e.name+' · '+e.location)}"><strong><b class="band-full">${esc(b.name)}</b><b class="band-short">${esc(b.short)}</b> ${esc(e.time||'未定')}</strong><span>${esc(e.location||'待公布')}</span></span>`}).join('')}${events.length>2?`<span class="eyebrow">+${events.length-2}</span>`:''}</button>`;}
 const total=first+days;for(let i=total;i<Math.ceil(total/7)*7;i++)cells+='<div class="cal-day blank" aria-hidden="true"></div>';
 $('#content').insertAdjacentHTML('beforeend',`<div class="calendar"><div class="cal-top"><h3>${y} 年 ${m+1} 月</h3><div><button data-month="-1" aria-label="上個月">←</button><button data-month="0">本月</button><button data-month="1" aria-label="下個月">→</button></div></div><div class="cal-week">${['日','一','二','三','四','五','六'].map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-grid">${cells}</div></div><p class="cal-help">手機顯示樂團首字與地點；點選日期可看完整樂團名稱與所有演出。</p>`);}
function renderStats(){let list=filter(data.events).filter(e=>statsBand==='all'||e.band===statsBand),shows=list.filter(e=>e.setlist?.length),counts=new Map();shows.forEach(e=>new Set(e.setlist.map(s=>s.songName)).forEach(name=>counts.set(name,(counts.get(name)||0)+1)));const songs=[...counts].sort((a,b)=>b[1]-a[1]);$('#content').innerHTML=`<div class="section-head"><h2>現場最常響起的歌</h2></div><div class="stats-list"><label>統計樂團 <select id="stats-band"><option value="all">全部</option>${[...new Set(data.events.map(e=>e.band))].map(id=>`<option value="${esc(id)}" ${statsBand===id?'selected':''}>${esc(bandInfo(id).name)}</option>`).join('')}</select></label><p class="foot-note">依目前樂團及搜尋條件統計；母數為 ${shows.length} 場有歌單的演出，同場重複曲目只計一次。</p>${songs.slice(0,50).map(([name,count])=>`<div class="stat"><span class="stat-name">${esc(name)}</span><span class="bar"><i style="width:${shows.length?count/shows.length*100:0}%"></i></span><span>${count} 場</span></div>`).join('')||'<div class="empty">尚無歌單可供統計。</div>'}</div>`;$('#stats-band').onchange=e=>{statsBand=e.target.value;renderStats()};}
function exportFootprints(){const blob=new Blob([JSON.stringify({version:1,ids:[...footprints]},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='聽團網-現場足跡.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importFootprints(e){try{const file=e.target.files[0];if(!file)return;if(file.size>1000000)throw Error('檔案過大');const d=JSON.parse(await file.text());if(d.version!==1||!Array.isArray(d.ids)||d.ids.some(x=>typeof x!=='string'||x.length>500))throw Error('足跡格式錯誤');d.ids.forEach(id=>footprints.add(id));if(!storage.set('ting-footprints',[...footprints]))toast('儲存空間不可用，足跡只會暫時保留');else toast('足跡已合併');render();}catch(e){toast(e.message);}}
$('#content').onclick=e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.view){view=t.dataset.view;render();}if(t.dataset.month!==undefined){const step=+t.dataset.month;month=step?new Date(month.getFullYear(),month.getMonth()+step,1):new Date(+taipeiToday.slice(0,4),+taipeiToday.slice(4,6)-1,1);render();}if(t.dataset.day){const key=t.dataset.day,events=filter(data.upcoming).filter(e=>dateKey(e.date)===key);$('#detail-title').textContent=`${key.slice(0,4)} / ${key.slice(4,6)} / ${key.slice(6,8)}`;$('#detail-body').innerHTML=events.map(e=>card(e)).join('')||'<p>這天還沒有演出。</p>';$('#detail').showModal();}if(t.dataset.foot){const id=t.dataset.foot;footprints.has(id)?footprints.delete(id):footprints.add(id);if(!storage.set('ting-footprints',[...footprints]))toast('瀏覽器無法保存足跡，請匯出備份');render();}};
$('#close-detail').onclick=()=>$('#detail').close();$('#detail').onclick=e=>{if(e.target===$('#detail')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}};
$('.nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;limit=24;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));render();};$('#filters').onclick=e=>{const b=e.target.closest('[data-band]');if(b){band=b.dataset.band;limit=24;render();}};
let debounce;$('#search').oninput=e=>{clearTimeout(debounce);debounce=setTimeout(()=>{query=e.target.value.trim().toLocaleLowerCase();limit=24;render();},180);};
const dark=storage.get('ting-theme',null)??(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.body.classList.toggle('dark',dark==='dark');$('#theme').onclick=()=>{const on=document.body.classList.toggle('dark');storage.set('ting-theme',on?'dark':'light');};
let lastY=scrollY,anchor=scrollY,dir=0,ticking=false;addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{const y=Math.max(0,scrollY),next=Math.sign(y-lastY);if(next!==dir){anchor=lastY;dir=next;}if(y<90||!matchMedia('(max-width:640px)').matches)$('#header').classList.remove('is-hidden');else if(Math.abs(y-anchor)>12&&!$('#header').contains(document.activeElement))$('#header').classList.toggle('is-hidden',dir>0);lastY=y;ticking=false;});},{passive:true});$('#header').addEventListener('focusin',()=>$('#header').classList.remove('is-hidden'));
load();
